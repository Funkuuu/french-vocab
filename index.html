],["elle","她 / 它"],["nous","我们"],["vous","您 / 你们"],["ils","他们（阳或混）"],["elles","她们"]],"ex":[["Je suis chinois.","我是中国人。"],["Tu es étudiant ?","你是大学生吗？"],["Elle est dans ma classe.","她在我班上。"]]},{"t":"动词变位 la conjugaison","b":"法语动词要跟着主语变词尾，这个过程叫变位。\n变位形式 = 词根 + 词尾。\n· 第一组动词：不定式以 -er 结尾（除 aller），占法语动词的绝大多数，变位最规律\n· 第二组动词：不定式以 -ir 结尾，第一人称复数变位带 -iss-（如 finir → nous finissons）\n· 第三组动词：其余全是不规则动词（être、avoir、aller、faire、prendre……）\n每组动词的变位要单独记，不能按英语那套套。","ex":[["Je parle français.","我说法语。"],["Nous parlons chinois à la maison.","我们在家说中文。"],["Vous parlez très bien.","您说得很好。"]]},{"t":"动词 s'appeler （名字）叫","b":"代词式动词，自反代词要跟主语保持一致。\n问名字：Comment tu t'appelles ? / Comment vous appelez-vous ?\n回答：Je m'appelle Marie. / Moi, c'est Marie.","tb":[["je m'appelle","我叫"],["tu t'appelles","你叫"],["il / elle s'appelle","他 / 她叫"],["nous nous appelons","我们叫"],["vous vous appelez","您 / 你们叫"],["ils / elles s'appellent","他们 / 她们叫"]],"ex":[["Je m'appelle Marie.","我叫玛丽。"],["Comment tu t'appelles ?","你叫什么名字？"],["Il s'appelle Pascal.","他叫帕斯卡尔。"]]}]},"2":{"comm":["简单的自我介绍"],"phon":["元音 [ə] [y] [u]","辅音 [k] [g] [s] [z]"],"vocab":["国籍名词、形容词"],"culture":[],"points":[{"t":"动词 être 的变位","b":"法语最常用的动词，也是完全不规则的，必须背熟。\n· 表示身份、国籍、职业：Je suis étudiant. / Il est français. / Elle est médecin.\n· 注意名词作表语时不加冠词（不说 je suis un étudiant）。","tb":[["je suis","我是"],["tu es","你是"],["il / elle est","他 / 她是"],["nous sommes","我们是"],["vous êtes","您 / 你们是"],["ils / elles sont","他们 / 她们是"]],"ex":[["Je suis étudiant.","我是大学生。"],["Nous sommes en classe.","我们在上课。"],["Ils sont français.","他们是法国人。"]]},{"t":"第一组动词的变位（-er 结尾）","b":"去掉不定式的 -er 得到词根，再加下面六个词尾。\n· 词尾：-e、-es、-e、-ons、-ez、-ent\n· je / tu / il / ils 四个人称的读音完全一样（词尾不发音），靠主语区分\n· 以 parler 为例：","tb":[["je parle","nous parlons"],["tu parles","vous parlez"],["il / elle parle","ils / elles parlent"]],"ex":[["J'adore le chocolat.","我酷爱巧克力。"],["Tu habites à Paris ?","你住在巴黎吗？"],["Elles chantent très bien.","她们唱得很好。"]]},{"t":"重读人称代词 les pronoms toniques","b":"不能直接作主语，用在四个场合：\n1) 强调主语：Moi, je suis chinois.\n2) 单独回答：Qui est-ce ? — Moi.\n3) 介词后面：avec toi、chez eux、pour moi\n4) c'est 后面：C'est moi. / C'est lui.","tb":[["moi","我"],["toi","你"],["lui / elle","他 / 她"],["nous","我们"],["vous","您 / 你们"],["eux / elles","他们 / 她们"]],"ex":[["Moi, je suis chinois.","我，我是中国人。"],["Et toi, tu fais quoi ?","那你呢，你做什么？"],["C'est lui.","是他。"]]},{"t":"国籍名词、形容词的阴阳性","b":"形容词要跟名词性数一致：français → française。\n常见规律：一般加 -e；-en → -enne（italien → italienne）；-ien → -ienne；-ais → -aise（japonais → japonaise）。\n以 -e 结尾的形容词阴阳性同形：russe、belge、chinois？（注意 chinois → chinoise 要变）。\n大小写：作形容词时小写（un film français），作名词指人时大写（un Français）。","ex":[["Il est français.","他是法国人。"],["Elle est française.","她是法国人。"],["un étudiant japonais","一个日本学生"],["une étudiante japonaise","一个日本女学生"]]}]},"3":{"comm":["法式问候（2）","tu 与 vous 的转换"],"phon":["元音 [œ] [ø]","辅音 [l] [ʒ] [ʃ] [v]"],"vocab":["数字 0—10"],"culture":[],"points":[{"t":"陈述句 la phrase déclarative","b":"最基本的句型：主语 + 动词 + 补充成分。\nJe vais au parc. / Il est étudiant. / Nous habitons à Paris.\n陈述句语序固定，不能像中文那样随意调换。","ex":[["Je vais au parc.","我去公园。"],["Il est étudiant.","他是大学生。"],["Nous habitons à Paris.","我们住在巴黎。"]]},{"t":"疑问句 la phrase interrogative","b":"三种问法，从随意到正式：\n1) 语调上扬（口语）：Tu vas au parc ?\n2) est-ce que + 陈述句（最常用、最安全）：Est-ce que tu vas au parc ?\n3) 主谓倒装（正式、书面）：Vas-tu au parc ?\n特殊疑问词：où 哪里、quand 何时、comment 怎样、qui 谁、quoi 什么、combien 多少。\n特殊疑问句：Où vas-tu ? / Qu'est-ce que tu fais ?","ex":[["Tu vas au parc ?","你去公园吗？"],["Est-ce que tu vas au parc ?","你去公园吗？"],["Vas-tu au parc ?","你去公园吗？（正式）"],["Où vas-tu ?","你去哪儿？"]]},{"t":"动词 aller、avoir、faire","b":"三个最常用的不规则动词，必须背熟。\n· aller 常接 à + 地点：Je vais à Paris. / Comment allez-vous ?（问身体）\n· avoir 表示拥有、年龄、感受：J'ai vingt ans. / J'ai faim.\n· faire 表示做、从事、天气：faire du sport / Il fait beau.","tb":[["aller","vais / vas / va / allons / allez / vont"],["avoir","ai / as / a / avons / avez / ont"],["faire","fais / fais / fait / faisons / faites / font"]],"ex":[["Je vais à l'école.","我去学校。"],["J'ai vingt ans.","我二十岁。"],["Il fait beau aujourd'hui.","今天天气很好。"],["Nous faisons du sport.","我们做运动。"]]}]},"4":{"comm":["标点符号","介绍自己和他人","提出请求或询问信息","提供信息"],"phon":["元音 [o] [ɔ]","辅音 [l] [r] [m] [n] [ɲ]"],"vocab":["喜好","婚姻状况","职业名词","数字 11—69"],"culture":[],"points":[{"t":"否定句 la phrase négative","b":"基本格式：ne + 动词 + pas，两个否定词把动词夹在中间。\nJe ne comprends pas. / Il ne vient pas.\n· ne 在元音或哑音 h 前省音成 n'：Je n'aime pas le café.\n· 其他否定词组：ne… jamais 从不、ne… plus 不再、ne… rien 什么也不、ne… personne 没有人","tb":[["ne… pas","不"],["ne… jamais","从不"],["ne… plus","不再"],["ne… rien","什么也不"],["ne… personne","没有人"]],"ex":[["Je ne comprends pas.","我不懂。"],["Il ne vient pas.","他不来。"],["Je n'aime pas le café.","我不喜欢咖啡。"]]},{"t":"名词和形容词的性数变化","b":"法语名词分阳性和阴性，都有单复数；形容词必须跟所修饰的名词性数一致。\n· 复数一般加 -s（un livre → des livres）\n· 名词本来以 -s、-x、-z 结尾的，复数不变（un pays → des pays）\n· 形容词加 -e 变阴性，加 -s 变复数：petit → petite → petites\n· 特殊：-al → -aux（national → nationaux）；-eau → -eaux（beau → beaux）","ex":[["un livre → des livres","一本书 → 书"],["un pays → des pays","一个国家 → 国家"],["petit → petite → petits","小的（阳单→阴单→阳复）"],["national → nationaux","民族的（阳复）"]]},{"t":"形容词的位置","b":"绝大多数形容词放在名词后面：un livre intéressant、une robe rouge。\n少数常用短形容词放在名词前，主要是：grand、petit、bon、mauvais、jeune、vieux、beau、joli、nouveau、premier。\n放在前面的形容词复数时，前面的 des 要变成 de：de beaux jardins。","ex":[["un livre intéressant","一本有意思的书"],["une robe rouge","一条红裙子"],["un grand jardin","一个大花园"],["de beaux jardins","一些漂亮的花园"]]},{"t":"动词 vouloir、écrire、apprendre","b":"vouloir 想要——礼貌请求常用条件式 Je voudrais…\nécrire 写（过去分词 écrit）\napprendre 学习（过去分词 appris）","tb":[["vouloir","veux / veux / veut / voulons / voulez / veulent"],["écrire","écris / écris / écrit / écrivons / écrivez / écrivent"],["apprendre","apprends / apprends / apprend / apprenons / apprenez / apprennent"]],"ex":[["Je voudrais un café.","我想要一杯咖啡。"],["J'écris une lettre.","我在写信。"],["J'apprends le français.","我在学法语。"]]}]},"5":{"comm":["谈论兴趣爱好","表达频次"],"phon":["鼻化元音 [ɔ̃] [ɑ̃] [ɛ̃] [œ̃]"],"vocab":["体育运动","艺术爱好","数字 70—100"],"culture":[],"points":[{"t":"定冠词与不定冠词","b":"不定冠词 un / une / des：指不确定的、泛指的、第一次提到的人或物。\nC'est un livre. / Il y a des fleurs.\n定冠词 le / la / les：指已确定的、特指的、前面提到过的，或表示整体概念。\nLe livre est sur la table. / J'aime les fruits.（泛指类别）\n· le / la 在元音或哑音 h 前省音成 l'：l'ami、l'école","tb":[["","阳单","阴单","复数"],["不定冠词","un","une","des"],["定冠词","le / l'","la / l'","les"]],"ex":[["C'est un livre.","这是一本书。"],["Il y a des fleurs ici.","这里有花。"],["Le livre est sur la table.","那本书在桌上。"],["J'aime les fruits.","我喜欢水果。"]]},{"t":"指示形容词 les adjectifs démonstratifs","b":"相当于中文的“这个 / 那个”，要跟名词性数一致。\n· 阳性单数以元音或哑音 h 开头时，ce 要变成 cet：cet ami、cet homme\n· 一般加 -ci / -là 区分远近：ce livre-ci 这本、ce livre-là 那本","tb":[["阳性单数","ce / cet"],["阴性单数","cette"],["复数","ces"]],"ex":[["ce livre","这本书"],["cet ami","这个朋友"],["cette robe","这条裙子"],["ces enfants","这些孩子"]]},{"t":"动词 connaître、dormir、jouer","b":"connaître 认识、了解（il connaît 的 î 要带长音符号）\ndormir 睡觉\njouer 玩 —— 注意两个搭配：\n· jouer à + 运动、游戏：jouer au tennis、jouer aux jeux vidéo\n· jouer de + 乐器：jouer du violon、jouer du piano","tb":[["connaître","connais / connais / connaît / connaissons / connaissez / connaissent"],["dormir","dors / dors / dort / dormons / dormez / dorment"],["jouer","joue / joues / joue / jouons / jouez / jouent"]],"ex":[["Tu connais ce peintre ?","你认识这位画家吗？"],["Je dors huit heures par nuit.","我每晚睡八小时。"],["Il joue au tennis.","他打网球。"],["Elle joue du violon.","她拉小提琴。"]]}]},"6":{"comm":["家庭关系","人物性格描写"],"phon":["半元音 [ɥ] [w] [j]"],"vocab":["家庭","性格形容词","数字 101—9999"],"culture":[],"points":[{"t":"主有形容词 les adjectifs possessifs","b":"表示“我的 / 你的 / 他的……”，性数跟**所修饰的名词**一致，不跟拥有者一致。\n所以 sa sœur 既可以是“他的姐妹”也可以是“她的姐妹”，要看上下文。\n· 阴性单数名词以元音或哑音 h 开头时，用 mon / ton / son：mon amie、ton école（为了好听）","tb":[["拥有者","阳单","阴单","复数"],["我","mon","ma / mon","mes"],["你","ton","ta / ton","tes"],["他 / 她","son","sa / son","ses"],["我们","notre","notre","nos"],["您 / 你们","votre","votre","vos"],["他们","leur","leur","leurs"]],"ex":[["mon père","我父亲"],["ma mère","我母亲"],["mes parents","我父母"],["mon amie","我的女朋友"],["leur maison","他们的房子"]]},{"t":"泛指人称代词 on","b":"on 永远搭配第三人称单数动词。\n两种意思：\n· 口语里 = nous（我们）：On va au parc ? = Nous allons au parc ?\n· 泛指“人们、大家”：On parle français ici.\n注意 on 作主语时动词用 il 的形式：On est、on a、on va。","ex":[["On va au parc ?","我们去公园吧？"],["On parle français ici.","这里说法语。"],["On est contents.","我们很高兴。"]]},{"t":"形容词 beau、nouveau、vieux、fou、mou 的特殊形","b":"这五个形容词有两种阳性单数形式：\n· 一般形式用在辅音开头的名词前：un beau jardin\n· 特殊形式用在元音或哑音 h 开头的名词前：un bel ami、un nouvel homme、un vieil ami\n其余形式见下表。","tb":[["","阳单(辅音前)","阳单(元音前)","阴单","阳复","阴复"],["beau","beau","bel","belle","beaux","belles"],["nouveau","nouveau","nouvel","nouvelle","nouveaux","nouvelles"],["vieux","vieux","vieil","vieille","vieux","vieilles"],["fou","fou","fol","folle","fous","folles"],["mou","mou","mol","molle","mous","molles"]],"ex":[["un beau jardin / un bel ami","一个漂亮的花园 / 一个帅气的朋友"],["un nouvel étudiant","一个新的学生"],["une belle robe","一条漂亮的裙子"],["de beaux jardins","一些漂亮的花园"]]},{"t":"复数形容词前 de 的用法","b":"形容词放在名词前面且为复数时，不定冠词 des 要变成 de。\n· de beaux jardins（不说 des beaux jardins）\n· de grands enfants\n形容词在名词后面时不变：des livres intéressants。","ex":[["de beaux jardins","漂亮的花园"],["de grands enfants","大孩子们"],["des livres intéressants","有意思的书（形容词在后，不变）"]]},{"t":"动词 dire、voir、partir","b":"dire 说（vous dites 不规则，不说 disez）\nvoir 看见（过去分词 vu）\npartir 出发、离开（过去分词 parti，用 être 作助动词）","tb":[["dire","dis / dis / dit / disons / dites / disent"],["voir","vois / vois / voit / voyons / voyez / voient"],["partir","pars / pars / part / partons / partez / partent"]],"ex":[["Il dit toujours la vérité.","他总是说实话。"],["Vous dites bonjour.","你们问好。"],["Je vois un chat.","我看见一只猫。"],["Ils partent en vacances.","他们去度假。"]]}]},"7":{"comm":["询问和表达时间","介绍某地"],"phon":["字母（组合）的发音"],"vocab":["方位词","一天中的各个时间段","数字 10 000 及以上"],"culture":[],"points":[{"t":"城市与国家前的介词","b":"表示“去某地 / 来自某地”时，介词取决于地点是城市还是国家、国家是阴性还是阳性、单数还是复数。\n· 城市：用 à / de —— à Paris、de Paris\n· 阴性国家：用 en / de —— en France、de France\n· 阳性国家：用 au / du —— au Japon、du Japon\n· 复数国家：用 aux / des —— aux États-Unis、des États-Unis","tb":[["","去……","来自……"],["城市","à Paris","de Paris"],["阴性国家","en France","de France"],["阳性国家","au Japon","du Japon"],["复数国家","aux États-Unis","des États-Unis"]],"ex":[["Je vais à Paris.","我去巴黎。"],["Je viens de Paris.","我来自巴黎。"],["Elle habite en France.","她住在法国。"],["Il va au Japon.","他去日本。"],["aux États-Unis","去美国"]]},{"t":"冠词的缩合 la contraction de l'article","b":"介词 à、de 遇到定冠词 le、les 时必须缩合，不能分开写。\n· à + le = au　　à + les = aux\n· de + le = du　　de + les = des\n注意 la 和 l' 不缩合：à la maison、à l'école、de la France。","tb":[["à + le","→ au"],["à + les","→ aux"],["de + le","→ du"],["de + les","→ des"]],"ex":[["Je vais au cinéma.","我去电影院。"],["Je parle aux étudiants.","我跟学生们说话。"],["Je viens du Japon.","我来自日本。"],["Je viens des États-Unis.","我来自美国。"],["à la maison / à l'école","在家 / 在学校（不缩合）"]]},{"t":"无人称句 la phrase impersonnelle","b":"用 il 作形式主语，这个 il 不指任何人，是固定结构。\n· il y a 有：Il y a un café près d'ici.\n· 天气：Il fait beau. / Il pleut. / Il fait chaud. / Il fait froid.\n· 时间：Il est quelle heure ?","tb":[["il y a","有"],["Il fait beau.","天气很好。"],["Il pleut.","下雨。"],["Il fait chaud / froid.","天热 / 天冷。"]],"ex":[["Il y a un café près d'ici.","这附近有一家咖啡馆。"],["Il fait beau.","天气很好。"],["Il pleut.","下雨了。"],["Il fait chaud.","天热。"]]},{"t":"疑问句的回答","b":"肯定回答用 Oui，否定回答用 Non。\n特殊点：如果原句是否定疑问句，肯定回答要用 Si，不是 Oui。\n— Tu ne viens pas ? 你不来吗？\n— Si ! 不，我来！\n— Tu viens ? — Oui. 肯定疑问句照常用 Oui。","ex":[["— Tu viens ? — Oui.","——你来吗？——来。"],["— Tu ne viens pas ? — Si !","——你不来吗？——不，我来！"],["— Tu es étudiant ? — Non.","——你是学生吗？——不是。"]]}]},"8":{"comm":["点餐常用语","表达好恶"],"phon":["法语语音规则总表"],"vocab":["食物"],"culture":[],"points":[{"t":"法语九大词类 les neuf classes de mots","b":"法语把词分成九类，这是后面所有语法的基础。\n判断一个词的类别，看它在句子里的作用，而不是看它的拼写。","tb":[["名词 le nom","pain 面包、famille 家庭"],["冠词 l'article","le、un、du"],["形容词 l'adjectif","grand、intéressant"],["代词 le pronom","je、celui、on"],["动词 le verbe","manger、être"],["副词 l'adverbe","très、souvent"],["介词 la préposition","à、de、avec"],["连词 la conjonction","et、mais、parce que"],["叹词 l'interjection","Oh !、Allô !"]],"ex":[["un grand jardin","一个大花园（形容词）"],["Je mange du pain.","我吃面包。"],["Il court vite.","他跑得快（副词）"],["avec toi","和你一起（介词）"]]},{"t":"部分冠词 les articles partitifs","b":"用于**不可数**名词，表示“一部分、一些”，不能精确计数。\n· 肯定句：Je mange du pain. / Je bois de l'eau. / Il y a de la confiture.\n· 想表示具体数量，要用数量词：un morceau de fromage、une tasse de thé、beaucoup de","tb":[["阳性","du"],["阴性","de la"],["元音 / 哑音 h 前","de l'"],["复数","des"]],"ex":[["Je mange du pain.","我吃面包。"],["Je bois de l'eau.","我喝水。"],["Il y a de la confiture.","有果酱。"],["un morceau de fromage","一块奶酪"]]},{"t":"三类冠词的区分","b":"这是第 8 课的重点，三个表要分清。","tb":[["不定冠词","un / une / des","可数名词，泛指、未确定"],["定冠词","le / la / l' / les","已确定、特指，或指整体类别"],["部分冠词","du / de la / de l' / des","不可数名词，表示一部分的量"]],"ex":[["un livre / des livres","一本书 / 书（不定冠词）"],["le livre / les livres","那本书 / 那些书（定冠词）"],["du pain / de l'eau","面包 / 水（部分冠词）"]]},{"t":"否定句中冠词的变化","b":"重要规则：**不定冠词和部分冠词，在否定句中要变成 de**。\nJ'ai du pain. → Je n'ai pas de pain.\nIl y a des fruits. → Il n'y a pas de fruits.\n· 但**定冠词不变**：Je n'aime pas le fromage.（否定的是“喜欢”这个动作，不是奶酪）\n· être 后面的表语冠词通常保留：Ce n'est pas un problème.","tb":[["肯定","否定"],["J'ai du pain.","Je n'ai pas de pain."],["Il y a des fruits.","Il n'y a pas de fruits."],["J'aime le fromage.","Je n'aime pas le fromage.（不变）"]],"ex":[["J'ai du pain. → Je n'ai pas de pain.","我有面包。→ 我没有面包。"],["Il y a des fruits. → Il n'y a pas de fruits.","有水果。→ 没有水果。"],["J'aime le fromage. → Je n'aime pas le fromage.","我喜欢奶酪。→ 我不喜欢奶酪。（定冠词不变）"]]},{"t":"第二组动词的变位","b":"不定式以 -ir 结尾，且第一人称复数变位带 -iss-，这是判断标准。\n词尾：-is、-is、-it、-issons、-issez、-issent。\n常见：finir 结束、choisir 选择、réussir 成功、grandir 长大、rougir 变红、applaudir 鼓掌","tb":[["finir","finis / finis / finit / finissons / finissez / finissent"],["choisir","choisis / choisis / choisit / choisissons / choisissez / choisissent"],["rougir","rougis / rougis / rougit / rougissons / rougissez / rougissent"]],"ex":[["Je finis mon travail.","我做完工作。"],["Nous choisissons une robe.","我们选一条连衣裙。"],["Elle rougit.","她脸红了。"]]},{"t":"动词 pouvoir、prendre、acheter、boire、manger","b":"pouvoir 能够（不规则的第三人称单数 peut）\nprendre 拿、吃（词干变化大）\nacheter 买（重读时 e 变 è，但 nous / vous 不变）\nboire 喝（词干 boi- / buv- 交替）\nmanger 吃（**nous mangeons** 保留 e，为了保持 [ʒ] 的读音）","tb":[["pouvoir","peux / peux / peut / pouvons / pouvez / peuvent"],["prendre","prends / prends / prend / prenons / prenez / prennent"],["acheter","achète / achètes / achète / achetons / achetez / achètent"],["boire","bois / bois / boit / buvons / buvez / boivent"],["manger","mange / manges / mange / mangeons / mangez / mangent"]],"ex":[["Je peux vous aider ?","我能帮您吗？"],["Il prend un café.","他喝一杯咖啡。"],["Nous mangeons à midi.","我们中午吃饭。"],["Vous buvez du thé ?","您喝茶吗？"]]},{"t":"泛指代词 rien","b":"表示“什么都没有、什么也不”，必须与 ne 连用，放在动词后面（复合时态放在助动词和过去分词之间）。\n· Je ne veux rien. 我什么都不要。\n· Il ne dit rien. 他什么也不说。\n· Je n'ai rien mangé. 我什么都没吃。\n单独使用（不带 ne）时表示“没什么、没事”：— Qu'est-ce qu'il y a ? — Rien.","ex":[["Je ne veux rien.","我什么都不要。"],["Il ne dit rien.","他什么也不说。"],["Je n'ai rien mangé.","我什么都没吃。"]]}]},"9":{"comm":["电话用语","购物用语"],"phon":[],"vocab":["服装与配饰","颜色"],"culture":[],"points":[{"t":"限定词 les déterminants","b":"放在名词前面的一类词，用来交代这个名词的**性数、特指还是泛指、数量、所属、疑问**。\n可以理解为“名词的身份证”，名词前面通常至少有一个限定词。","tb":[["冠词","le / un / du"],["指示形容词","ce / cet / cette / ces"],["主有形容词","mon / ton / son / notre…"],["数量词","deux、beaucoup de、un peu de"],["疑问 / 感叹形容词","quel / quelle"]],"ex":[["le livre / un livre / mon livre","那本书 / 一本书 / 我的书"],["ce livre / deux livres","这本书 / 两本书"],["quel livre ?","哪本书？"]]},{"t":"直接宾语人称代词 les pronoms personnels COD","b":"代替前面出现过的直接宾语（不带介词的人或物），**位置在动词前面**。\n· Tu connais cette robe ? — Oui, je **la** connais.\n· Je **les** aime beaucoup.\n· 否定句：把 ne… pas 夹住代词和动词：Je ne la connais pas.\n· 复合过去时：代词放在助动词前，过去分词要性数配合：Je l'ai vue.","tb":[["me","我"],["te","你"],["le / la","他 / 她 / 它"],["nous","我们"],["vous","您 / 你们"],["les","他们 / 她们"]],"ex":[["Tu connais cette robe ? — Oui, je la connais.","你认识这条裙子吗？——是的，我认识。"],["Je les aime beaucoup.","我很喜欢它们。"],["Je ne la connais pas.","我不认识她。"],["Je l'ai vue hier.","我昨天见过她。"]]},{"t":"动词 devoir、payer","b":"devoir 应该、必须（过去分词 dû，带长音符号）\npayer 支付（有两种写法，paie 系更常用；过去分词 payé）","tb":[["devoir","dois / dois / doit / devons / devez / doivent"],["payer","paie / paies / paie / payons / payez / paient"]],"ex":[["Tu dois essayer cette robe.","你应该试一下这条裙子。"],["Je dois partir.","我得走了。"],["Vous payez à la caisse.","您在收银台付款。"]]}]},"10":{"comm":["人物描写"],"phon":[],"vocab":["头发颜色","布料花色","方位介词"],"culture":[],"points":[{"t":"关系代词 qui","b":"引导关系从句，**在从句中作主语**，后面直接跟动词。\n· C'est un acteur **qui** est très célèbre.\n· J'ai un ami **qui** habite à Paris.\n· qui 没有性数变化，先行词可以指人也可以指物：un livre qui parle de Paris。\n· 注意：qui 后面永远不能紧跟另一个主语。","ex":[["C'est un acteur qui est très célèbre.","这是一位非常有名的演员。"],["J'ai un ami qui habite à Paris.","我有一个住在巴黎的朋友。"],["un livre qui parle de Paris","一本关于巴黎的书"]]},{"t":"指示代词 les pronoms démonstratifs","b":"代替前面提到的人或物，避免重复，必须与所指代的名词性数一致。\n· Ma robe ? C'est **celle** que j'aime.\n· Ce livre ? C'est **celui** de Paul.\n常与 -ci（这个）/ -là（那个）连用区分：celui-ci、celui-là。","tb":[["阳性单数","celui"],["阴性单数","celle"],["阳性复数","ceux"],["阴性复数","celles"]],"ex":[["Ma robe ? C'est celle que j'aime.","我的裙子？就是我喜欢的那个。"],["Ce livre ? C'est celui de Paul.","这本书？是保罗的那本。"],["celui-ci / celui-là","这个 / 那个"]]},{"t":"间接宾语人称代词 les pronoms personnels COI","b":"代替“介词 à + 人”，位置也在动词前面。\n· Je **lui** parle. 我跟他说。\n· Je **leur** téléphone. 我给他们打电话。\n· 常见搭配间接宾语的动词：parler à、téléphoner à、plaire à、ressembler à、offrir qch. à qn","tb":[["me","我"],["te","你"],["lui","他 / 她（注意不区分男女）"],["nous","我们"],["vous","您 / 你们"],["leur","他们 / 她们"]],"ex":[["Je lui parle.","我跟他说。"],["Je leur téléphone.","我给他们打电话。"],["Ce film lui plaît.","他喜欢这部电影。"]]}]},"11":{"comm":["谈论住房","表达喜好"],"phon":[],"vocab":["居所","方位介词短语"],"culture":[],"points":[{"t":"直陈式最近将来时 le futur proche","b":"构成：**aller 的现在时 + 动词不定式**，表示即将发生的事。\n· Je **vais partir**. 我要走了。\n· Il **va pleuvoir**. 快下雨了。\n· Nous **allons visiter** le musée. 我们要去参观博物馆。\n和简单将来时（futur simple）的区别：最近将来时更口语、时间更近。","ex":[["Je vais partir.","我要走了。"],["Il va pleuvoir.","快下雨了。"],["Nous allons visiter le musée.","我们要去参观博物馆。"]]},{"t":"序数词 les adjectifs numéraux ordinaux","b":"构成：基数词 + **-ième**。\ndeux → deuxième、trois → troisième、dix → dixième。\n四个要注意的例外：\n· 第一：premier（阳）/ première（阴）\n· cinq → cinquième（加 u）\n· neuf → neuvième（f 变 v）\n· 以 -e 结尾的基数词去掉 e：quatre → quatrième\n用法：le deuxième étage 三层（法式楼层，底楼算一层）","ex":[["le premier / la première","第一"],["le deuxième","第二"],["le cinquième","第五"],["le neuvième","第九"]]},{"t":"关系代词 que","b":"引导关系从句，**在从句中作直接宾语**，所以从句必须有主语。\n· Le livre **que** je lis est intéressant.（que 是 lire 的宾语）\n· La robe **qu'**elle porte est belle.（que 在元音前省音）\nqui 与 que 的区别：qui 后面跟动词（作主语），que 后面跟主语（作宾语）。","tb":[["qui","作主语","l'ami **qui** vient 来的那个朋友"],["que","作宾语","l'ami **que** je vois 我见的那个朋友"]],"ex":[["Le livre que je lis est intéressant.","我读的这本书很有意思。"],["La robe qu'elle porte est belle.","她穿的裙子很美。"],["l'ami qui vient / l'ami que je vois","来的朋友 / 我见的朋友"]]},{"t":"动词 offrir、peindre、entendre","b":"offrir 提供、赠送（过去分词 offert）\npeindre 画（词干 pein- / peign- 交替，过去分词 peint）\nentendre 听见（过去分词 entendu）","tb":[["offrir","offre / offres / offre / offrons / offrez / offrent"],["peindre","peins / peins / peint / peignons / peignez / peignent"],["entendre","entends / entends / entend / entendons / entendez / entendent"]],"ex":[["Il offre des fleurs à sa mère.","他送花给妈妈。"],["Il peint un paysage.","他画一幅风景。"],["J'entends des cris.","我听见叫喊声。"]]}]},"12":{"comm":["时间表达法","年、月、日及日期的表达"],"phon":[],"vocab":["日常活动动词","季节、月份、星期"],"culture":["法国人的时间概念"],"points":[{"t":"泛指形容词 tout","b":"表示“整个的、全部的、所有的”，性数跟后面修饰的名词一致，放在限定词（定冠词 / 主有形容词等）的前面。\n· **tout** le monde 所有人、**tout** le temps 一直、**toute** la journée 一整天、**tous** les jours 每天\n· Il a plu **toute** la journée. 下了一整天雨。\n读音注意：作形容词时 tous 读 [tu]；作代词时读 [tus]。","tb":[["阳性单数","tout le monde 所有人"],["阴性单数","toute la journée 一整天"],["阳性复数","tous les jours 每天"],["阴性复数","toutes les semaines 每周"]],"ex":[["tout le monde","所有人"],["tout le temps","一直"],["toute la journée","一整天"],["tous les jours","每天"],["toutes les semaines","每周"]]},{"t":"代词式动词 les verbes pronominaux","b":"由**自反代词 + 动词**构成，自反代词随主语变化。\n· Je **me** lève à sept heures. / Tu **te** lèves / Il **se** lève\n· 复合过去时**用 être 作助动词**，过去分词要与主语性数配合：\n  Elle s'est levée tôt. / Ils se sont levés tôt.\n· 常见代词式动词：se lever 起床、s'appeler 叫、se coucher 睡觉、s'amuser 玩、se promener 散步、se dépêcher 赶快、s'endormir 睡着、s'asseoir 坐下","tb":[["je","me lève"],["tu","te lèves"],["il / elle","se lève"],["nous","nous levons"],["vous","vous levez"],["ils / elles","se lèvent"]],"ex":[["Je me lève à sept heures.","我七点起床。"],["Elle s'appelle Marie.","她叫玛丽。"],["Nous nous promenons au parc.","我们在公园散步。"],["Elle s'est levée tôt.","她起得很早。"]]},{"t":"法语动词种类","b":"复习一下三组动词的划分，这是变位的基础。","tb":[["第一组","不定式 -er（除 aller）","约占 90%，最规则：parler、aimer"],["第二组","不定式 -ir，且 nous 形式带 -iss-","finir、choisir、rougir"],["第三组","其余全部","être、avoir、aller、faire、prendre、voir……"]],"ex":[["parler / aimer","第一组（-er）"],["finir / choisir","第二组（-ir，nous 带 -iss-）"],["être / avoir / prendre","第三组（不规则）"]]},{"t":"动词 s'asseoir、mettre","b":"s'asseoir 坐下（有两种变位体系，课本用 assieds 这一套；命令式 assieds-toi / asseyez-vous）\nmettre 放、穿（过去分词 mis）","tb":[["s'asseoir","m'assieds / t'assieds / s'assied / nous asseyons / vous asseyez / s'asseyent"],["mettre","mets / mets / met / mettons / mettez / mettent"]],"ex":[["Asseyez-vous, s'il vous plaît.","请坐。"],["Assieds-toi ici.","坐这儿。"],["Mets ton manteau.","穿上你的大衣。"],["Il a mis son manteau.","他穿上了大衣。"]]}]},"13":{"comm":["介绍传统节日"],"phon":[],"vocab":["节日"],"culture":["法国的节日"],"points":[{"t":"用 avoir 做助动词的复合过去时 le passé composé","b":"构成：**avoir 的现在时 + 过去分词**，表示已经完成的过去动作。\n· J'**ai mangé**. / Tu **as fini**. / Il **a pris** le train. / Nous **avons vu** ce film.\n**绝大多数动词用 avoir 作助动词**（下一课才讲用 être 的）。\n· 用 avoir 时，过去分词**不跟主语性数配合**（和主语无关）。\n· 否定：ne 和 pas 夹住助动词——Je **n'ai pas** mangé.\n· 语序：代词宾语放在助动词前——Je **l'ai** vu.","tb":[["je","j'ai parlé"],["tu","tu as parlé"],["il / elle","il a parlé"],["nous","nous avons parlé"],["vous","vous avez parlé"],["ils / elles","ils ont parlé"]],"ex":[["J'ai mangé.","我吃过了。"],["Tu as fini ?","你做完了吗？"],["Il a pris le train.","他乘了火车。"],["Je n'ai pas mangé.","我没吃。"],["Je l'ai vu.","我见过他。"]]},{"t":"过去分词的形成 le participe passé","b":"记住三组动词的规律，剩下的不规则形式单独背。","tb":[["第一组 -er","→ -é","parler → parlé、manger → mangé"],["第二组 -ir","→ -i","finir → fini、choisir → choisi"],["第三组","不规则","avoir → eu、être → été、faire → fait、prendre → pris、voir → vu、boire → bu、dire → dit、écrire → écrit、mettre → mis、lire → lu、ouvrir → ouvert、recevoir → reçu、devoir → dû、connaître → connu、naître → né"]],"ex":[["parler → parlé","第一组 -é"],["finir → fini","第二组 -i"],["faire → fait","第三组（不规则）"],["prendre → pris","第三组（不规则）"],["voir → vu","第三组（不规则）"]]}]},"14":{"comm":["介绍人物生平"],"phon":[],"vocab":["人物生平"],"culture":["改变世界的文化名人"],"points":[{"t":"用 être 做助动词的复合过去时","b":"**极少部分动词用 être 作助动词**，主要是表示“来去、进出、上下、留走、生死”的不及物动词，以及**所有代词式动词**。\n常用的一批（可以成对记）：\naller / venir、arriver / partir、entrer / sortir、monter / descendre、rester、tomber、naître / mourir。\n关键区别：**用 être 时，过去分词要与主语性数配合**。","tb":[["Il est allé.","他去了（男）"],["Elle est allée.","她去了（多一个 e）"],["Ils sont allés.","他们去了（多一个 s）"],["Elles sont allées.","她们去了（es）"]],"ex":[["Il est allé à Paris.","他去了巴黎。"],["Elle est allée à Paris.","她去了巴黎。"],["Ils sont allés à Paris.","他们去了巴黎。"],["Elles sont allées à Paris.","她们去了巴黎。"],["Je ne suis pas parti.","我没走。"],["Elle s'est levée tôt.","她起得很早。"]]},{"t":"être 助动词的否定与代词式动词","b":"否定还是夹住助动词：Je **ne suis pas** parti. / Elle **n'est pas** arrivée.\n代词式动词用 être：\n· Je **me suis** levé(e). / Elle **s'est** levée. / Ils **se sont** levés.\n· 注意自反代词在 ne 后面：Je ne **me suis pas** levé.","ex":[["Je suis né à Paris.","我生于巴黎。"],["Il est tombé.","他摔倒了。"],["Nous sommes restés à la maison.","我们待在家里。"],["Elle est morte en 2000.","她于 2000 年去世。"]]},{"t":"时间表达法：depuis / il y a","b":"这两个最容易混，区别在**动词时态**。\n**depuis + 时间 / 起点**——表示从过去延续到现在的动作，动词用**现在时**：\n· J'habite à Paris **depuis** deux ans. 我住在巴黎两年了。（现在还住）\n· Il est malade **depuis** lundi. 他从周一起就病了。\n**il y a + 时间**——表示“距今多久以前”，动词用**过去时**：\n· Il est arrivé **il y a** deux heures. 他两小时前到的。\n一句话记：depuis 回答“多久了”，il y a 回答“什么时候”。","tb":[["depuis deux ans","两年来（还在继续）→ 现在时"],["il y a deux ans","两年前（已经过去）→ 过去时"],["depuis lundi","从周一起"],["il y a un mois","一个月前"]],"ex":[["J'habite à Paris depuis deux ans.","我住在巴黎两年了。"],["Il est malade depuis lundi.","他从周一起就病了。"],["Il est arrivé il y a deux heures.","他两小时前到的。"],["Il y a un mois, j'étais à Nice.","一个月前我在尼斯。"]]}]}},"textes":{"1":{"title":"BONJOUR !","source":"书 p.6","parts":[{"label":"1","type":"dialogue","lines":[["Bonjour.","你好。"],["Bonjour. Comment allez-vous ?","你好。您好吗？"],["Bien, merci. Et vous ?","很好，谢谢。您呢？"],["Très bien.","很好。"]]},{"label":"2","type":"dialogue","lines":[["Salut. Ça va ?","嗨。你好吗？"],["Oui, et toi ?","好，你呢？"],["Très bien.","很好。"]]},{"label":"3","type":"dialogue","lines":[["Salut, je m'appelle Pascal. P-a-s-c-a-l. Et toi ?","嗨，我叫帕斯卡尔。P-a-s-c-a-l。你呢？"],["Moi, c'est Alice, A-l-i-c-e.","我，是艾丽斯，A-l-i-c-e。"]]},{"label":"4","type":"dialogue","lines":[["Bonne journée, ciao !","日安，再见！"],["Salut, à demain.","再见，明天见。"]]},{"label":"Pour la classe de français","type":"dialogue","lines":[["Je ne comprends pas.","我没懂。"],["Plus fort, s'il vous plaît !","请大点儿声！"],["Répétez, s'il vous plaît !","请重复一下！"]]}]},"2":{"title":"DANS LE DÉPARTEMENT DE FRANÇAIS","source":"书 p.15","parts":[{"label":"1 · En classe de français","type":"dialogue","lines":[["Bonjour. Je m'appelle Julie, je suis française et je suis votre professeur de français. Et vous ?","你好。我叫朱莉，我是法国人，是你们的法语老师。你们呢？"],["Bonjour, Thomas Lucas, journaliste, je suis américain, j'adore le français et les Françaises.","你好，托马斯·卢卡斯，记者，我是美国人，我酷爱法语和法国女性。"],["Salut, je suis japonaise, je suis étudiante, je m'appelle Yoko, moi aussi j'aime le français. Mais c'est difficile pour moi.","嗨，我是日本人，是学生，我叫洋子，我也喜欢法语。但对我来说很难。"],["Salut, Wang Leilei, Leilei, c'est mon prénom, Wang, c'est mon nom de famille. Je suis chinois, je suis avocat. Je parle anglais.","嗨，王磊磊，磊磊是我的名，王是我的姓。我是中国人，我是律师。我说英语。"]]},{"label":"2 · Qui est-ce ?","type":"dialogue","lines":[["Salut, je suis Thomas Lucas, américain. Tu es chinoise ?","嗨，我是托马斯·卢卡斯，美国人。你是中国人吗？"],["Non, japonaise, je m'appelle Yoko. Elle, là-bas, elle est chinoise. Elle s'appelle Lin. Lui, c'est qui ?","不是，是日本人，我叫洋子。她，在那边，她是中国人。她叫林。他，是谁？"],["C'est Claude, professeur de français ! Il est canadien.","这是克洛德，法语老师！他是加拿大人。"]]},{"label":"Pour la classe de français","type":"dialogue","lines":[["Vous pouvez répéter, s'il vous plaît ?","您能重复一下吗？"],["Comment ça s'écrit ?","这怎么写？"],["Travaillez en groupe.","分组练习。"],["Lisez. Répétez. Écoutez. Écrivez.","读。重复。听。写。"]]}]},"3":{"title":"ON SE TUTOYE ?","source":"书 p.25","parts":[{"label":"1","type":"dialogue","lines":[["On se tutoie ?","我们以“你”相称吧？"],["Si tu veux.","如果你愿意的话。"]]},{"label":"2","type":"dialogue","lines":[["Vous êtes en retard. Vous vous appelez comment ?","您迟到了。您叫什么名字？"],["Rémi Falami.","雷米·法拉米。"]]},{"label":"3","type":"dialogue","lines":[["Vous habitez où ?","您住哪儿？"],["3 rue d'Italie, à Nice.","尼斯，意大利街 3 号。"],["Qu'est-ce que vous faites comme travail ?","您做什么工作？"]]},{"label":"4","type":"dialogue","lines":[["Comment allez-vous ?","您好吗？"],["Très bien. Et vous ?","很好。您呢？"]]},{"label":"5","type":"dialogue","lines":[["Salut ! Tu vas bien ?","嗨！你好吗？"],["Oui, et toi ?","好，你呢？"]]},{"label":"6","type":"dialogue","lines":[["Est-ce que vous êtes japonaise ?","您是日本人吗？"],["Non, chinoise.","不，是中国人。"]]},{"label":"Monsieur Berger rencontre sa voisine Madame Dumas dans la rue","type":"dialogue","lines":[["M. Berger : Bonjour Madame Dumas. Vous allez bien ?","贝尔热先生：您好，迪马夫人。您好吗？"],["Mme Dumas : Très bien. Merci. Je vous présente Mélissa.","迪马夫人：很好。谢谢。我向您介绍梅丽莎。"],["M. Berger : C'est Mélissa, votre petite-fille ? Qu'elle est jolie !","贝尔热先生：这是梅丽莎，您的孙女？她真漂亮！"],["Mme Dumas : Elle ne parle pas encore. Elle a un an. Elle est adorable. Elle aime beaucoup les parcs et les fleurs. Il fait beau, alors on va au parc.","迪马夫人：她还不会说话。她一岁。她很讨人喜欢。她很喜欢公园和花。天气好，所以我们去公园。"],["M. Berger : Bonne promenade et bonne journée !","贝尔热先生：散步愉快，日安！"],["Mme Dumas : Vous aussi, au revoir.","迪马夫人：您也是，再见。"]]}]},"4":{"title":"TU CONNAIS ?","source":"书 p.37","parts":[{"label":"1","type":"dialogue","lines":[["Qui est-ce ?","这是谁？"],["C'est Picasso, tu ne connais pas ?","这是毕加索，你不认识吗？"],["Non, qu'est-ce qu'il fait ?","不认识，他是做什么的？"],["C'est un peintre espagnol très célèbre.","他是一位非常有名的西班牙画家。"]]},{"label":"2","type":"dialogue","lines":[["Vous connaissez le couscous ?","您知道古斯古斯吗？"],["Non, c'est quoi ?","不知道，那是什么？"],["C'est une spécialité marocaine. J'adore.","是摩洛哥特色菜。我酷爱。"]]},{"label":"3","type":"dialogue","lines":[["S'il vous plaît, je cherche un cadeau pour un ami chinois. Il apprend le français.","请问，我在给一位中国朋友找礼物。他在学法语。"],["J'ai Le Petit Prince. Il connaît ?","我有《小王子》。他知道吗？"],["C'est difficile pour lui.","对他来说太难了。"],["Alors, j'ai Tintin en français.","那，我有法文版《丁丁历险记》。"],["Excellente idée !","好主意！"]]}]},"5":{"title":"C'EST POUR UNE ENQUÊTE !","source":"书 p.53","parts":[{"label":"Génération 90 : Enquête sur vos loisirs !","type":"form","lines":[["Vous êtes :","您是：",["Étudiant.","Étudiante."]],["1. Pratiquez-vous des activités sportives ou artistiques à l'université ?","1. 您在学校参加体育活动或艺术活动吗？",["Oui.","Non."]],["2. Que pratiquez-vous comme sport ?","2. 您做什么运动？",["Le jogging.","Le badminton.","Le vélo.","Le foot."]],["3. Que faites-vous comme activité artistique ?","3. 您做什么艺术活动？",["La peinture.","La musique.","Le théâtre.","La photographie."]],["4. Qu'est-ce que vous aimez faire au dortoir ?","4. 您喜欢在宿舍做什么？",["Lire.","Faire le ménage.","Jouer aux jeux vidéo.","Dormir."]],["5. Allez-vous souvent à la médiathèque ?","5. 您常去多媒体图书馆吗？",["Jamais.","Rarement.","Une fois par semaine.","Une fois tous les trois mois."]]]}]},"6":{"title":"ARBRE GÉNÉALOGIQUE","source":"书 p.67（广播访谈）","parts":[{"label":"访谈","type":"dialogue","lines":[["Animateur : Mesdames et messieurs, bonsoir ! Ce soir, on a trois invités pour parler de leur famille : Barbara, Romain et Emma. Bonsoir !","主持人：女士们先生们，晚上好！今晚我们有三位嘉宾来谈谈他们的家庭：芭芭拉、罗曼和艾玛。你们好！"],["Barbara, Romain & Emma : Bonsoir !","三人：晚上好！"],["Animateur : Alors, Barbara, dites-nous comment est votre famille.","主持人：那么，芭芭拉，请告诉我们您的家庭是怎样的。"],["Barbara : Je suis fille unique et j'ai deux enfants. Je vois souvent mes parents. Mes parents sont très compréhensifs avec moi et ils gâtent leurs petits-enfants. On part souvent en vacances. Mais quelquefois, ma mère est un peu trop protectrice. Elle oublie : sa fille a 40 ans.","芭芭拉：我是独生女，有两个孩子。我常去看父母。我父母对我很理解，也很宠爱他们的孙辈。我们常去度假。但有时，我妈妈有点过于呵护了。她忘了：她女儿已经 40 岁了。"],["Romain : Mes parents sont divorcés. Je suis proche de ma mère mais je vois rarement mon père. Il est remarié et je n'aime pas beaucoup sa nouvelle femme, ma belle-mère. J'ai un frère et une sœur, ils sont très sympathiques. La fille de mon frère, donc ma nièce, elle est adorable !","罗曼：我父母离婚了。我和妈妈关系近，但很少见到爸爸。他再婚了，我不太喜欢他的新妻子，也就是我的继母。我有一个兄弟和一个姐妹，他们都很友好。我兄弟的女儿，也就是我的侄女，非常讨人喜欢！"],["Animateur : Vous êtes un super oncle ! Et vous, Emma, on a envie de connaître votre famille !","主持人：您是个很棒的叔叔！那您呢，艾玛，我们想了解您的家庭！"],["Emma : Moi, c'est un peu différent. Je suis étudiante en droit à Paris. J'ai d'excellentes relations avec ma famille. Je vois souvent mes parents, mon petit frère et notre chat Maya, mais sur l'écran. En fait, je suis russe, et ma famille habite loin, à Moscou. Je pense à eux tout le temps.","艾玛：我有点不一样。我在巴黎学法律。我和家人关系很好。我常看到我父母、我弟弟还有我们的猫玛雅，但都是在屏幕上。其实我是俄罗斯人，我家人住得很远，在莫斯科。我一直想着他们。"],["Animateur : Et c'est une famille très chouette, nous sommes sûrs ! Merci à Barbara, Romain et Emma ! Merci de vos témoignages ! Bonne soirée !","主持人：这一定是个非常棒的家庭！感谢芭芭拉、罗曼和艾玛！感谢你们的分享！晚上愉快！"]]}]},"7":{"title":"ICI ET LÀ","source":"书 p.83","parts":[{"label":"Dialogue","type":"dialogue","lines":[["Allô, Maxime ? C'est moi, Sandra. Devine où je suis !","喂，马克西姆？是我，桑德拉。猜猜我在哪儿！"],["... Il est quelle heure ?","……几点了？"],["Il est dix heures et demie, oh pardon, je te réveille ?","十点半，哦抱歉，我吵醒你了吗？"],["Oui ma chérie. Tu es où ?","是的，亲爱的。你在哪儿？"],["Désolée mais je suis trop émue ! Je suis sur la Grande Muraille de Chine, à Beijing ! C'est magnifique ! En plus, il fait beau. C'est une immense ville de plus de 20 millions d'habitants...","抱歉，我太激动了！我在北京，在长城上！太壮观了！而且天气很好。这是一座两千多万人口的大城市……"],["D'accord mais ici il fait encore nuit. Je dors... Tout le monde dort...","好吧，可这边还是夜里。我在睡觉……所有人都在睡……"],["Tu ne m'aimes plus ?","你不爱我了吗？"],["Mais si, je t'aime, mais il est trois heures et demie du matin chez moi, à Montauban, en France.","当然爱，但在我这儿，法国蒙托邦，现在是凌晨三点半。"]]},{"label":"Carte postale","type":"text","lines":[["Chers papa et maman,","亲爱的爸爸妈妈，"],["Je vous écris dans un café, à Aix-en-Provence.","我在普罗旺斯地区艾克斯的一家咖啡馆给你们写信。"],["C'est une ville très mignonne avec plus de 140 000 habitants. Elle est située dans le sud de la France, près de Marseille.","这是一座很可爱的城市，有十四万多居民。它位于法国南部，马赛附近。"],["Il y a beaucoup d'universités et donc plein d'étudiants. Ici, le soleil brille toujours même s'il pleut dans toute la France !","这里有很多大学，所以有很多学生。在法国到处下雨的时候，这里的太阳也总是灿烂！"],["Gros bisous.","亲亲。"],["Amélie","阿梅莉"]]}]},"8":{"title":"LES REPAS CHEZ LES DUPONT","source":"书 p.100（阅读）","parts":[{"label":"课文","type":"text","lines":[["Pour beaucoup d'étrangers, les Français mangent tous les matins des croissants et des pains au chocolat.","在很多外国人看来，法国人每天早上都吃牛角包和巧克力面包。"],["Mais le petit-déjeuner des Français peut aussi être très léger.","但法国人的早餐也可以非常清淡。"],["Comme chez les Dupont, il comprend une tartine, c'est-à-dire un morceau de baguette avec de la confiture, une tasse de café et un jus de fruit. Les enfants prennent souvent des céréales et du chocolat chaud.","比如在杜蓬家，早餐包括一片涂果酱的面包（也就是一块长棍面包加果酱）、一杯咖啡和一杯果汁。孩子们常吃谷类食品和热巧克力。"],["On déjeune entre 12 et 14 heures. On mange à la cantine, au restaurant d'à côté ou on achète un sandwich. Monsieur Dupont est très occupé. Parfois il ne mange rien à midi.","人们在 12 点到 14 点之间吃午饭。在食堂、旁边的餐馆吃，或者买个三明治。杜蓬先生很忙，有时中午什么都不吃。"],["Les Dupont ne dînent pas avant 20 heures. Dans un repas typique chez eux, il y a une entrée, un plat principal (du poisson ou de la viande avec des légumes, des pâtes, du riz ou des frites) et du fromage.","杜蓬家不到 20 点不吃晚饭。他们家典型的一餐有头盘、主菜（鱼或肉配蔬菜、面食、米饭或薯条）和奶酪。"],["Ils finissent le repas avec un dessert : une pâtisserie, une glace ou un fruit. Pour digérer, M. Dupont boit souvent du café et Mme Dupont du thé.","他们最后吃一道甜点：糕点、冰激凌或水果。为了消化，杜蓬先生常喝咖啡，杜蓬夫人喝茶。"],["Les boissons sont une partie très importante du repas. M. Dupont aime bien prendre un apéritif avant de passer à table.","饮品是一餐中非常重要的一部分。杜蓬先生喜欢在入席前喝一杯开胃酒。"],["Pendant le repas, ils boivent souvent du vin. En France, on choisit les vins pour accompagner les plats : vin rouge pour viandes rouges, vin blanc pour fruits de mer et viandes blanches. Mme Dupont aime beaucoup le vin blanc.","用餐时他们常喝葡萄酒。在法国，人们选酒来配菜：红肉配红酒，海鲜和白肉配白葡萄酒。杜蓬夫人很喜欢白葡萄酒。"],["Les repas chez les Dupont ressemblent à ceux de beaucoup de Français. Mais attention, ils peuvent être différents d'une personne à une autre et d'une région à une autre !","杜蓬家的饮食和很多法国人相似。但注意，它们可能因人而异、因地而异！"]]}]},"8b":{"title":"DANS UN RESTAURANT CHINOIS À PARIS","source":"书 p.101（对话）","parts":[{"label":"对话","type":"dialogue","lines":[["Amélie : S'il vous plaît, mademoiselle, qu'est-ce que vous avez comme plat ?","阿梅莉：小姐，请问有什么菜？"],["Serveuse : Il y a du poisson à la vapeur, du chou ou du Gongbaojiding.","服务员：有清蒸鱼、白菜，或者宫保鸡丁。"],["Amélie : C'est quoi ça ?","阿梅莉：那是什么？"],["Léo : C'est une spécialité du Sichuan, c'est du poulet au piment, avec des cacahouètes.","莱奥：是四川特色菜，是辣椒鸡肉，还有花生。"],["Amélie : Au piment ?! Quelle horreur ! Ça se mange ?","阿梅莉：放辣椒？！太可怕了！这能吃吗？"],["Léo : C'est très bon ! Tout le monde adore ce plat, mes copains prennent tout le temps ça !","莱奥：很好吃！大家都喜欢这道菜，我朋友们总点这个！"],["Amélie : Bon, d'accord. Je prends un Gongbaojiding, avec du riz.","阿梅莉：好吧。我要一份宫保鸡丁，配米饭。"],["Serveuse : Pour vous, monsieur ?","服务员：先生，您呢？"],["Léo : Des raviolis pour moi.","莱奥：我要饺子。"],["Serveuse : Désolée, il n'y a plus de raviolis aujourd'hui.","服务员：抱歉，今天饺子没有了。"],["Léo : Alors, un poisson à la vapeur pour moi. Je ne veux pas de riz.","莱奥：那我要一份清蒸鱼。不要米饭。"],["Serveuse : Vous voulez boire quelque chose ?","服务员：您要喝点什么吗？"],["Léo : Du vin ?","莱奥：葡萄酒？"],["Amélie : Pas pour moi, je ne supporte pas l'alcool.","阿梅莉：我不要，我受不了酒精。"],["Léo : Alors, du thé ?","莱奥：那，茶？"],["Amélie : Je n'aime pas ça. Vous n'avez pas d'eau minérale ?","阿梅莉：我不喜欢。你们没有矿泉水吗？"],["Léo : Dis donc, on est dans un restaurant chinois, fais comme les Chinois !","莱奥：哎，我们在中国餐馆，就照中国人的样子来吧！"]]}]},"9":{"title":"FOLIE ACHETEUSE","source":"书 p.115","parts":[{"label":"Chez Noémie. Le téléphone sonne.","type":"dialogue","lines":[["Sandra : Allô, Noémie ? C'est Sandra. Je te dérange ?","桑德拉：喂，诺埃米？我是桑德拉。打扰你了吗？"],["Noémie : Pas du tout. Ça va ?","诺埃米：一点也没有。你好吗？"],["Sandra : Très bien, merci. Demain, c'est le 15 janvier, ça t'intéresse de faire les soldes ?","桑德拉：很好，谢谢。明天是一月十五号，你有兴趣去买打折商品吗？"],["Noémie : Ça tombe bien, je dois acheter une robe pour aller à un cocktail ce week-end.","诺埃米：正好，我要买一条连衣裙去参加这个周末的鸡尾酒会。"],["Sandra : Demain, à onze heures trente devant l'entrée des galeries Lafayette ?","桑德拉：明天十一点半，老佛爷百货入口前？"],["Noémie : Entendu.","诺埃米：说定了。"]]},{"label":"Le lendemain. Aux galeries Lafayette.","type":"dialogue","lines":[["Sandra : Regarde cette robe, elle est sublime ! Tu peux la porter pour ton cocktail. En plus, 30 euros, ce n'est pas cher pour une robe en soie.","桑德拉：看这条连衣裙，绝美！你可以穿着去鸡尾酒会。而且 30 欧元，一件丝绸连衣裙不贵。"],["Vendeur : Bonjour, mesdemoiselles, je peux vous aider ?","售货员：小姐们好，需要我帮忙吗？"],["Noémie : Cette robe, vous l'avez en d'autres couleurs ?","诺埃米：这条连衣裙，你们有其他颜色吗？"],["Vendeur : Oui, je l'ai en bleu, blanc et rouge. Vous avez du goût, elle est très élégante.","售货员：有的，有蓝色、白色和红色。您很有品位，它很优雅。"],["Noémie : Je voudrais bien essayer la bleue.","诺埃米：我想试一下蓝色的。"],["Vendeur : Pas de problème. Quelle est votre taille ?","售货员：没问题。您穿多大尺码？"],["Noémie : Je porte du 38.","诺埃米：我穿 38 码。"],["Vendeur : La voilà. La cabine d'essayage est au fond, à gauche.","售货员：给您。试衣间在最里面，左边。"],["Sandra : Bon, je vais voir d'autres boutiques. Tu m'appelles quand tu finis ?","桑德拉：那我去看看别的店。你弄完了给我打电话？"]]},{"label":"Noémie fait la queue à la caisse.","type":"dialogue","lines":[["Sandra : Tu es encore là ?","桑德拉：你还在啊？"],["Noémie : Désolée mais ce n'est pas facile de décider.","诺埃米：抱歉，但决定起来不容易。"],["Sandra : Qu'est-ce que tu prends ?","桑德拉：你买什么？"],["Noémie : Cette robe bleue, je la prends mais en 40. La taille 38 est trop petite. Et aussi cette ceinture. Et toi ?","诺埃米：这条蓝裙子，我买 40 码的。38 码太小了。还有这条腰带。你呢？"],["Sandra : Oh là là, je suis très contente. Un pull, une chemise et un manteau noir en laine pour cet hiver. Aussi ces magnifiques chaussettes pour mon chéri !","桑德拉：哎哟，我很满意。一件毛衣、一件衬衫和一件冬天穿的黑色羊毛大衣。还有这些漂亮的袜子给我的男朋友！"],["Sandra : Le vingt-huit février, c'est son anniversaire. Il y a sept couleurs, une couleur par jour !","桑德拉：二月二十八号是他的生日。有七种颜色，一天穿一种！"],["Noémie : Oui... elles sont euh... rigolotes comme cadeau. Il a de la chance Maxime...","诺埃米：是啊……这礼物挺……好玩的。马克西姆真走运……"],["Vendeur : Ça vous fait 100 euros, s'il vous plaît.","售货员：一共 100 欧元。"],["Noémie : Je peux payer par chèque ?","诺埃米：我可以用支票付款吗？"],["Vendeur : Bien sûr, mademoiselle. Merci, bonne journée.","售货员：当然可以，小姐。谢谢，日安。"]]}]},"10":{"title":"SOURIEZ, VOUS ÊTES FILMÉS !","source":"书 p.127（找人大挑战）","parts":[{"label":"课文","type":"text","lines":[["Elle est assise au milieu de la salle. C'est la brune aux cheveux longs qui sourit. Tu ne vois pas ? C'est celle qui porte un pull à rayures.","她坐在教室中间。就是那个微笑的长发棕发女子。你没看见吗？就是穿条纹毛衣的那个。"],["C'est le garçon blond à lunettes qui porte une chemise à carreaux. Ça y est ? Oui ! C'est celui qui est assis devant tout le monde !","就是那个戴眼镜、穿格子衬衫的金发男孩。找到了吗？对！就是坐在所有人前面的那个！"],["C'est le petit blond en rouge à côté de la porte en verre. Non, il ne porte pas de lunettes. Elle est au fond de la salle, debout contre le mur, entre deux garçons. C'est celle qui porte un pull blanc et on voit aussi sa chemise rouge. Si, c'est une femme, c'est la maîtresse !","是玻璃门旁边那个穿红衣服的金发小个子。不，他不戴眼镜。她在教室最里面，靠墙站着，在两个男孩中间。就是穿白色毛衣、还能看见她红衬衫的那个。不，她是个女的，是老师！"]]},{"label":"L'HEURE DE PAPARAZZIS !","type":"text","lines":[["Sophie Darceau, c'est la brune en costume qui marche là-bas.","索菲·达尔索，就是那边走着的穿套装的棕发女子。"],["Sonia Rousselle, c'est la rousse à la chemise noire.","索尼娅·鲁塞尔，就是那个穿黑衬衫的红发女子。"],["Leblanc, c'est le monsieur aux cheveux blancs qui porte des lunettes de soleil. Il est toujours en noir et blanc. C'est un créateur très célèbre.","勒布朗，就是那位戴墨镜的白发先生。他总是穿黑白两色。他是一位非常有名的设计师。"],["À côté de lui, la femme qui sourit, c'est Inès de l'Angélique, elle est aussi créatrice et mannequin.","他旁边微笑的那位女士是伊内斯·德·朗热利克，她也是设计师和模特。"]]}]},"10b":{"title":"SECRET ENTRE COPINES...","source":"书 p.128（对话）","parts":[{"label":"对话","type":"dialogue","lines":[["Allô Julie !","喂，朱莉！"],["Salut Laetitia...","嗨，利蒂希娅……"],["Julie, je suis amoureuse !","朱莉，我恋爱了！"],["Je le connais ?","我认识他吗？"],["Oui.","认识。"],["Attends. Laisse-moi deviner. Est-ce qu'il est blond ?","等等。让我猜猜。他是金发吗？"],["Non.","不是。"],["Alors ce n'est pas Thomas. Il est grand ?","那就不是托马斯。他个子高吗？"],["Non.","不高。"],["Alors ce n'est pas François...","那就不是弗朗索瓦……"],["Je vais t'aider : il est brun, il ne porte pas de lunettes, il est très sportif, il n'a pas de voiture mais il a une moto. Il est étudiant dans la même fac.","我来帮你：他是棕发，不戴眼镜，很爱运动，没有汽车但有一辆摩托车。他在同一个学院上学。"],["Ça y est, j'ai trouvé ! C'est Michael ! Est-ce qu'il est au courant ?","好了，我猜到了！是米夏埃尔！他知道吗？"],["Non. Je rougis dès que je le vois. Je n'ose pas lui parler ! Mais il me plaît ! Qu'est-ce que je dois faire ?","不知道。我一看见他就脸红。我不敢跟他说话！但我喜欢他！我该怎么办？"],["Tu peux lui envoyer un SMS ou lui laisser un message avec ton numéro de téléphone sur facebook. Tu peux aussi l'inviter au restaurant pour le remercier de quelque chose...","你可以给他发条短信，或者在 Facebook 上给他留言、附上你的电话号码。你也可以请他去餐馆，为某件事感谢他……"],["Julie, tu es vraiment géniale !","朱莉，你真是太棒了！"]]}]},"11":{"title":"FILLE AU PAIR","source":"书 p.139、p.140","parts":[{"label":"Fille au pair（对话）","type":"dialogue","lines":[["(On sonne.)","（有人按门铃。）"],["Xiaomei : Bonjour. Monsieur Dubois ? Je suis Xiaomei, la jeune fille au pair.","小梅：您好。迪布瓦先生吗？我是小梅，来做互惠生的。"],["Martin : Je vous ouvre. C'est au cinquième étage, à droite.","马丁：我给您开门。在六楼，右边。"],["Martin : Bonjour ! Bienvenue ! Entrez, entrez. Je suis Martin Dubois. Les enfants sont à l'école, ils finissent à quatre heures et ma femme va rentrer avec eux. Voulez-vous boire quelque chose ?","马丁：你好！欢迎！请进，请进。我是马丁·迪布瓦。孩子们在学校，四点放学，我妻子会和他们一起回来。您要喝点什么吗？"],["Xiaomei : Je voudrais bien un verre d'eau, s'il vous plaît... Merci. C'est grand, chez vous.","小梅：我想要一杯水，谢谢……您家真大。"],["Martin : Venez, je vais vous montrer l'appartement. C'est le salon. La cuisine est à gauche. Voici la chambre de Valentin, l'aîné.","马丁：来，我带您看看房子。这是客厅。厨房在左边。这是老大瓦朗坦的房间。"],["Xiaomei : C'est lui sur la photo ? Il est mignon ! Quel âge a-t-il ?","小梅：照片上的是他吗？很可爱！他多大了？"],["Martin : Il va avoir 8 ans en octobre. C'est un garçon très calme. En face de sa chambre, c'est celle de son petit frère, Raphaël.","马丁：十月他就八岁了。他是个很安静的孩子。他房间对面是他弟弟拉斐尔的房间。"],["Xiaomei : C'est chouette d'avoir sa propre chambre ! ... Je vois que Raphaël est un grand sportif !","小梅：有自己的房间真好！……我看拉斐尔很爱运动！"],["Martin : C'est sa passion. Ils sont différents, les deux enfants. Le grand plaisir de Valentin, ce sont les livres. Il peut passer des heures à lire. Raphaël, il est fou de sports. Voici mon bureau. Je travaille ici le soir.","马丁：那是他的酷爱。两个孩子不一样。瓦朗坦最大的乐趣是书。他能读上好几个小时。拉斐尔则为运动狂热。这是我的书桌，我晚上在这儿工作。"],["Xiaomei : Vous faites aussi de la peinture ?","小梅：您也画画吗？"],["Martin : Non, c'est l'atelier de ma femme qui est une grande passionnée de peinture. Elle peint beaucoup pendant le temps libre. Elle est douée. La semaine prochaine, nous allons organiser une exposition pour elle.","马丁：不，这是我妻子的画室，她非常迷恋绘画。她有空就画很多。她有天赋。下周我们要为她办一个展览。"],["Xiaomei : C'est votre chambre ?","小梅：这是你们的卧室吗？"],["Martin : Non, cette pièce est pour vous. Notre chambre est de l'autre côté du salon. La salle de bains et les toilettes, que vous allez partager avec les enfants, sont au bout du couloir. Vous voulez poser vos affaires ? Je vous laisse.","马丁：不，这间是给您的。我们的卧室在客厅另一边。您和孩子们共用的浴室和卫生间在走廊尽头。您想先放下东西吗？我先走了。"],["Xiaomei : Merci, à tout à l'heure.","小梅：谢谢，待会儿见。"]]},{"label":"Journal de Xiaomei（日记）","type":"text","lines":[["J'ai une chambre agréable que j'aime beaucoup. Elle fait 12 mètres carrés environ.","我有一间我很喜欢的舒适房间。大约 12 平方米。"],["C'est très ensoleillé parce qu'elle est orientée vers le sud. C'est bien meublé.","它非常向阳，因为朝向南方。家具也很齐全。"],["J'ai un lit, un bureau, une chaise, des étagères pour mes livres et un placard pour mes affaires. Quel bonheur de pouvoir lire dans mon fauteuil sous le soleil !","我有一张床、一张书桌、一把椅子、放书的架子，还有放衣物的柜子。能在阳光下坐在扶手椅里读书，多么幸福！"],["Ma chambre donne sur une école. De ma fenêtre, je vois la cour de l'école et j'entends les cris et les rires des enfants.","我的房间朝着一所学校。从窗户望出去，我能看见学校的院子，听见孩子们的叫喊和笑声。"],["Le calme revient quand l'école finit à quatre heures.","四点学校放学后，安静又回来了。"]]}]},"12":{"title":"METTEZ VOS PENDULES À L'HEURE / LA JOURNÉE D'UNE JEUNE MAMAN","source":"书 p.153、p.154","parts":[{"label":"1","type":"dialogue","lines":[["Le TGV 728 à destination de Paris va partir à 19 h 18 voie 4.","开往巴黎的 TGV 728 次列车将于 19 点 18 分从 4 号站台发车。"],["Il est quelle heure ?","几点了？"]]},{"label":"2","type":"dialogue","lines":[["Dépêchez-vous les enfants ! Il est huit heures moins le quart ! C'est l'heure d'aller à l'école !","孩子们快点！七点三刻了！该上学了！"]]},{"label":"3","type":"dialogue","lines":[["Allô, je voudrais réserver une table pour 4 personnes pour dîner.","喂，我想订一张四人桌吃晚饭。"],["Vers quelle heure ?","大概几点？"],["Vers huit heures et demie.","大约八点半。"]]},{"label":"4","type":"dialogue","lines":[["Oh là là, il est une heure moins le quart. On va rater le dernier métro !","哎哟，十二点三刻了。我们要赶不上末班地铁了！"]]},{"label":"5","type":"dialogue","lines":[["Hier, on est allé dans une boîte de nuit. On est rentré à trois heures et demie.","昨天我们去了一家夜店。三点半才回来。"]]},{"label":"6","type":"dialogue","lines":[["Tu vas à Paris demain ?","你明天去巴黎吗？"],["Oui, je pars tôt. Je prends le train de 7 h 10.","是的，我很早出发。我乘 7 点 10 分的火车。"]]},{"label":"La journée d'une jeune maman qui travaille","type":"text","lines":[["(à la maison) Il est 6 h 15, il fait encore nuit. Sophie se lève. Elle a seulement une demi-heure pour se préparer.","（在家）6 点 15 分，天还黑着。索菲起床了。她只有半小时做准备。"],["À 6 h 45, elle va faire un bisou à son bébé qui dort encore et attend la nounou.","6 点 45 分，她去亲了一下还在睡觉、等着保姆来的宝宝。"],["(au bureau) À 8 h 30, les collègues arrivent et se saluent. Sophie peut enfin s'asseoir devant son bureau.","（在办公室）8 点 30 分，同事们到了，互相打招呼。索菲终于能在办公桌前坐下。"],["Ce matin, elle doit se dépêcher pour finir un rapport très important avant 11 h. Sinon, son directeur va se fâcher. On ne s'amuse pas au travail, surtout les femmes ! Sophie se met à travailler tout de suite.","今天上午她必须赶在 11 点前完成一份非常重要的报告。否则她的主任会发火。上班可不是玩的，尤其是女人！索菲马上开始工作。"],["(à la maison) Le travail se termine vers 18 h. La petite famille est heureuse de se retrouver à la maison.","（在家）工作大约 18 点结束。这一小家子人很高兴又聚在家里。"],["Sophie et son mari mangent et rigolent avec leur enfant. Après, ils partagent les tâches : son mari fait la vaisselle, elle couche le bébé.","索菲和丈夫和孩子一起吃饭、逗乐。之后他们分担家务：丈夫洗碗，她哄宝宝睡觉。"],["Elle lui raconte une histoire et très souvent, elle s'endort au milieu de l'histoire.","她给他讲故事，而且常常讲到一半自己就睡着了。"],["Vous allez demander : ça se passe où ? En France ou en Chine ?","你可能会问：这事发生在哪儿？法国还是中国？"],["C'est pareil pour toutes les jeunes mamans qui travaillent !","对所有上班的年轻妈妈来说都一样！"]]}]},"13":{"title":"QU'EST-CE QUE TU AS FAIT L'ANNÉE DERNIÈRE ?","source":"书 p.169（三段小短文）","parts":[{"label":"1 · Les journées du Patrimoine","type":"text","lines":[["Les journées du Patrimoine, les 18 et 19 septembre derniers, nous avons visité beaucoup de monuments : le palais de l'Élysée, le musée Rodin, les Invalides, Notre-Dame de Paris, Versailles...","上个月 9 月 18 日和 19 日是遗产日，我们参观了很多古迹：爱丽舍宫、罗丹博物馆、荣军院、巴黎圣母院、凡尔赛宫……"],["Nous avons profité de ces journées pour tout voir gratuitement.","我们趁着这些日子免费参观了所有地方。"]]},{"label":"2 · À Pâques","type":"text","lines":[["À Pâques, nous sommes allés chez mes beaux-parents qui ont préparé un gigot d'agneau délicieux.","复活节我们去了岳父母家，他们做了一条美味的羊腿。"],["Les enfants ont passé toute la journée dans le jardin à chercher des œufs en chocolat ! Tout le monde a été très content.","孩子们在花园里找了一整天的巧克力蛋！大家都很开心。"]]},{"label":"3 · La fête de la Musique","type":"text","lines":[["Le 21 juin, c'est la fête de la Musique. L'année dernière, avec mes amis, on a chanté toutes les chansons des Beatles au bord du canal Saint-Martin.","6 月 21 日是音乐节。去年我和朋友们在圣马丁运河边唱了所有甲壳虫乐队的歌。"],["Les gens ont beaucoup applaudi, ça a été très sympa. Après, on s'est promenés dans le quartier, il y avait de la musique partout. On a dansé aussi.","人们热烈鼓掌，非常热闹。之后我们在街区里散步，到处都有音乐。我们还跳了舞。"],["On n'a pas dormi, on a passé une nuit blanche !","我们没睡觉，熬了一个通宵！"]]}]},"14":{"title":"UN VOYAGE MOUVEMENTÉ","source":"书 p.184（阅读）","parts":[{"label":"课文","type":"text","lines":[["Le 18 décembre 2013, ma femme, mes deux enfants et moi, nous sommes arrivés à l'aéroport de Beijing pour prendre l'avion pour rentrer en France, car Noël c'est la fête la plus importante pour nous.","2013 年 12 月 18 日，我妻子、两个孩子和我到了北京机场，准备乘飞机回法国，因为圣诞节对我们来说是最重要的节日。"],["Mais nous n'avons pas pu partir à cause d'une grève à Roissy. Tous les vols ont été annulés. Alors, nous sommes retournés à la maison.","但因为鲁瓦西机场罢工，我们没能走成。所有航班都被取消了。于是我们回了家。"],["Deux jours après, nous sommes montés dans l'avion. Le voyage n'a pas été très confortable à cause de nombreuses turbulences. Heureusement, les enfants ont dormi pendant longtemps. Au bout de dix heures de vol, l'avion a atterri.","两天后，我们登上了飞机。因为气流很多，旅程不太舒服。幸亏孩子们睡了很久。飞行十小时后，飞机着陆了。"],["Le capitaine nous a annoncé une série d'informations avec beaucoup d'humour :","机长非常幽默地宣布了一系列消息："],["« Mauvaise nouvelle : l'aéroport de Roissy est fermé à cause d'une tempête de neige. Bonne nouvelle : l'aéroport d'Orly est encore ouvert. »","「坏消息：鲁瓦西机场因暴风雪关闭。好消息：奥利机场还开着。」"],["« Bonne nouvelle : nous avons atterri avec succès à Orly. Mauvaise nouvelle : nous sommes obligés d'attendre dans l'avion. »","「好消息：我们成功降落在奥利机场。坏消息：我们不得不在飞机上等。」"],["« Bonne nouvelle : nous avons maintenant l'autorisation de sortir de l'avion. Mauvaise nouvelle : vous devez attendre quelques jours pour retrouver vos bagages parce qu'ils sont restés à Beijing. »","「好消息：我们现在获准下飞机了。坏消息：你们得过几天才能取回行李，因为它们留在了北京。」"],["Ainsi, nous sommes revenus en France pour Noël mais sans les cadeaux de Noël.","就这样，我们回法国过了圣诞节，但没有圣诞礼物。"]]},{"label":"François Cheng, passeur de culture","type":"text","lines":[["François Cheng est né le 30 août 1929 en Chine, dans une famille de lettrés.","程抱一 1929 年 8 月 30 日生于中国一个文人家庭。"],["Entre 1937 et 1945, il a fait ses études secondaires à Chongqing, une grande ville dans le sud-ouest de la Chine. Il est entré à l'Université de Nankin pendant la guerre civile.","1937 至 1945 年间，他在中国西南的大城市重庆读中学。内战中他进入南京大学。"],["Début 1948, il est parti en France avec son père qui travaillait à l'UNESCO.","1948 年初，他和在联合国教科文组织工作的父亲一起去了法国。"],["Après une longue période d'adaptation et de solitude, il est devenu professeur à l'Institut national des langues et civilisations orientales.","经过漫长的适应和孤独期后，他成为国立东方语言文化学院的教授。"],["Il s'est consacré à la traduction de poèmes dans les deux langues, la réflexion sur la pensée et l'art chinois, et la création personnelle.","他投身于两种语言间的诗歌翻译、对中国思想与艺术的思考，以及个人创作。"],["Ses voyages incessants entre la Chine et l'Occident ont rendu ses travaux particulièrement riches et profonds.","他在中国与西方之间不断的往返，使他的作品格外丰富深刻。"],["Ces derniers ont été récompensés par de nombreux prix. En 2002, il est monté au sommet du milieu artistique et littéraire avec son élection à l'Académie française.","这些作品获得了众多奖项。2002 年，他当选法兰西学术院院士，登上艺术与文学界的顶峰。"]]}]}},"sentConj":{"aller":[{"s":"Nous ___ à Paris tous les étés.","a":"allons","i":3,"zh":"我们每年夏天都去巴黎。"},{"s":"Elle ___ au marché le samedi matin.","a":"va","i":2,"zh":"她每周六早上都去市场。"},{"s":"Je ___ souvent au marché le samedi matin.","a":"vais","i":0,"zh":"我周六早上常去市场。"},{"s":"Mes grands-parents ___ au parc tous les jours.","a":"vont","i":5,"zh":"我祖父母每天都去公园。"},{"s":"Tu ___ au cinéma ce soir ?","a":"vas","i":1,"zh":"你今晚去看电影吗？"} /* ---------------- 通用 ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wkey = w => w.s + "|" + w.fr;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function elide(sub, form){
  if(sub==="je" && /^[aeiouâàéèêîïôûùh]/i.test(form)) return "j'"+form;
  return sub+" "+form;
}
function highlight(sent, word){
  const head = word.replace(/\s*\(.*?\)\s*/g,"").trim().split(/[\s']/)[0];
  if(!head) return esc(sent);
  const rx = p => new RegExp("(?<!\\p{L})(" + p + ")(?!\\p{L})", "giu");
  const clean = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  let re = rx(clean(head)).test(sent) ? rx(clean(head)) : null;
  if(!re){
    for(let n = 1; n <= 3; n++){
      if(head.length - n < 3) break;
      const stem = clean(head.slice(0, head.length - n));
      const r = new RegExp("(?<!\\p{L})(" + stem + "\\p{L}*)(?!\\p{L})", "giu");
      if(r.test(sent)){ re = r; break; }
    }
  }
  return re ? esc(sent).replace(re, "<b>$1</b>") : esc(sent);
}

const VOICE = {fr:null, checked:false, total:0};
function pickFrVoice(){
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  VOICE.total = vs.length;
  if(!vs.length) return null;
  return vs.find(v => /^fr[-_]FR/i.test(v.lang))
      || vs.find(v => /^fr[-_]CA/i.test(v.lang))
      || vs.find(v => /^fr/i.test(v.lang))
      || null;               // 找不到法语就返回 null，绝不退回英语
}
function initVoices(){
  if(!window.speechSynthesis){ VOICE.checked = true; return; }
  const load = ()=>{
    const v = pickFrVoice();
    if(v) VOICE.fr = v;
    if(VOICE.fr || VOICE.total) VOICE.checked = true;
    if(screen === "home") renderHome();
  };
  load();
  try{ speechSynthesis.addEventListener("voiceschanged", load); }catch(e){ speechSynthesis.onvoiceschanged = load; }
  let n = 0;
  const t = setInterval(()=>{ load(); if(VOICE.fr || ++n > 12) clearInterval(t); }, 250);
  setTimeout(()=>{ VOICE.checked = true; if(screen === "home") renderHome(); }, 3000);
}
// 去掉词条里的语法标注，只念法语本身
function speakText(fr){
  return String(fr)
    .replace(/\(-\)/g, "-")
    .replace(/\s*\(.*?\)\s*/g, " ")
    .replace(/\s*\/\s*/g, ", ")
    .replace(/,\s*(e|s|se|sse|ne|ve|te|le|ue|ère|che|nouvelle|nouveaux)\s*$/i, "")
    .replace(/\s+([,?!.])/g, "$1")
    .replace(/\s+/g, " ")
    .trim();
}

const AUDIO_DIR = "audio/";

function audioKey(s){
  let x = 5381;
  for(let i = 0; i < s.length; i++) x = (x * 33 + s.charCodeAt(i)) >>> 0;
  return x.toString(16);
}
const AUDIO_INLINE_B64 = (typeof AUDIO_INLINE !== "undefined") ? AUDIO_INLINE : null;
function inlineAudio(text){ return AUDIO_INLINE_B64 ? (AUDIO_INLINE_B64[audioKey(text)] || null) : null; }

function speakTTS(text, silent){
  if(!window.speechSynthesis){ if(!silent) toast("这个浏览器不支持语音朗读，建议用 Chrome 或 Edge。"); return; }
  if(!VOICE.fr) VOICE.fr = pickFrVoice();
  if(!VOICE.fr){
    if(!silent) toast("没有本地音频，系统里也没找到法语语音包，所以读不出法语。\n\n" +
          "要么把 index.html 旁边的 audio 文件夹一起带上，\n" +
          "要么给系统装法语语音：设置 → 时间和语言 → 语言和区域 → 中文(中国) → ⋯ → 语言选项 → " +
          "语音 → 添加语音 → 选「法语(法国)」。装好刷新本页即可。");
    return;
  }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = VOICE.fr;
    u.lang = VOICE.fr.lang;
    u.rate = 0.8;
    setTimeout(()=>speechSynthesis.speak(u), 60);
  }catch(e){ if(!silent) toast("朗读失败：" + e.message); }
}

function speak(fr, silent){
  const text = speakText(fr);
  if(!text) return;
  try{
    if(curAudio){ curAudio.pause(); curAudio = null; }
    if(window.speechSynthesis) speechSynthesis.cancel();
    // 1) 单文件版：音频内嵌在 HTML 里
    const b64 = inlineAudio(text);
    if(b64){
      curAudio = new Audio("data:audio/mpeg;base64," + b64);
      AUDIO_MODE = "local";
      const p = curAudio.play();
      if(p && p.catch) p.catch(()=>{});       // 被自动播放策略拦了就静音，不退回
      return;
    }
    // 2) 本地 audio/ 文件夹
    if(!AUDIO_MISSING.has(text)){
      const a = new Audio(AUDIO_DIR + audioKey(text) + ".mp3");
      curAudio = a;
      let settled = false;
      a.addEventListener("playing", ()=>{ settled = true; AUDIO_MODE = "local"; });
      a.addEventListener("error", ()=>{          // 文件不存在 → 记下来，退回系统语音
        if(settled) return;
        settled = true; AUDIO_MISSING.add(text);
        // 这里**不能**改 AUDIO_MODE：少一个 mp3 只是这一句没声音，
        // 不该让首页显示「没找到 audio 文件夹」那种误导提示。
        // 有没有整个文件夹，由启动时的 probeAudio() 说了算。
        speakTTS(text, silent);
      });
      const p = a.play();
      if(p && p.catch) p.catch(()=>{
        if(settled) return;                     // 只是自动播放被拦，不当成文件缺失
        settled = true; speakTTS(text, silent);
      });
      return;
    }
  }catch(e){}
  // 3) 系统语音
  speakTTS(text, silent);
}

// 跳到新页面时自动读；没装法语语音就安静跳过，不弹提示刷屏
function autoSpeak(fr){
  if(!AUTO) return;
  const t = speakText(fr);
  const now = Date.now();
  if(t === lastSpoken.text && now - lastSpoken.at < 1500) return;
  lastSpoken.text = t; lastSpoken.at = now;
  speak(t, true);
}
function toast(msg){
  const d = document.createElement("div");
  d.className = "toast";
  d.textContent = msg;
  document.body.appendChild(d);
  requestAnimationFrame(()=>d.classList.add("on"));
  setTimeout(()=>{ d.classList.remove("on"); setTimeout(()=>d.remove(), 300); }, 7000);
}

/* ---------------- 间隔重复 ---------------- */
function rec(w){ return store.words[wkey(w)]; }
function isWrong(w){ return !!store.wrong[wkey(w)]; }
function finishWord(w, allCorrect){
  const k = wkey(w), now = Date.now();
  const r = store.words[k] || (store.words[k] = {box:0, due:0, right:0, wrong:0, seen:0});
  r.seen = now;
  if(allCorrect){
    r.right++;
    r.box = Math.min(r.box + 1, BOX_DAYS.length - 1);
    r.due = now + BOX_DAYS[r.box] * DAY;
    delete store.wrong[k];
  }else{
    r.wrong++;
    r.box = 0;
    r.due = now;
    const e = store.wrong[k] || (store.wrong[k] = {n:0});
    e.n++;
  }
  save();
}
function dueList(){
  const now = Date.now();
  return WORDS.filter(w => { const r = rec(w); return r && r.due <= now; });
}
function wrongList(){ return WORDS.filter(isWrong); }
function dueLabel(w){
  const r = rec(w);
  if(!r) return "还没学过";
  const d = r.due - Date.now();
  if(d <= 0) return "现在就该复习";
  if(d < 3600000) return Math.round(d/60000) + " 分钟后再复习";
  if(d < DAY) return "今天稍后再复习";
  return Math.round(d / DAY) + " 天后再复习";
}

/* ---------------- 查单词 ---------------- */
// 归一化：统一小写、把标点当空格
const strip = s => String(s).replace(/[«»"'’?!,;:.]/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
const norm = s => strip(s);                                  // 保留重音
const flat = s => strip(s).normalize("NFD").replace(/\p{M}/gu, "");   // 再去掉重音
// 词表里的 fr 有时带 ", -e" 或 "(à)"，取主体词
const baseOf = fr => flat(String(fr).split(",")[0].split("(")[0]);

const SV = { w: null, tense: "pr", from: "" };
let SIDX = null;

// 每个动词的 6 组形式全部建索引：变位形式 → 原形
const T_LABEL = [["pr","现在时"],["pc","复合过去时"],["im","未完成过去时"],
                 ["fu","简单将来时"],["co","条件式"],["imp","命令式"]];
// 代词式（m'amuse）和复合时态（ai accompagné）前面多一截，剥掉后还能再命中一次
const CLITIC = /^(?:[jmtsnld]|qu)['’]|^(?:je|tu|il|elle|on|nous|vous|ils|elles|me|te|se|le|la|les|lui|leur|ai|as|a|avons|avez|ont|suis|es|est|sommes|êtes|sont)\s+/;

// 三层索引，按精确度从高到低：
//   exact 带重音（chanté 和 chante 是两条不同的键，不会互相顶掉）
//   plain 去重音（用户懒得打符号时也能中）
//   loose 再去掉开头的代词/助动词（只输 amuse、allé 也能中）
function buildIndex(){
  if(SIDX) return SIDX;
  const exact = new Map(), plain = new Map(), loose = new Map();
  const setAll = (m, k, v) => { if(k && !m.has(k)) m.set(k, v); };
  const put = (form, inf, label) => {
    const f = norm(form);
    if(!f) return;
    const v = { inf, label };
    setAll(exact, f, v);
    setAll(plain, flat(f), v);
    const noCli = f.replace(CLITIC, "");
    if(noCli && noCli !== f) setAll(loose, flat(noCli), v);
  };
  for(const [inf, c] of Object.entries(CONJ)){
    put(inf, inf, "原形");
    for(const [k, label] of T_LABEL){
      const v = c[k];
      if(Array.isArray(v)) v.forEach(f => put(f, inf, label));
      else if(typeof v === "string") put(v, inf, label);
    }
    if(c.pp) put(c.pp, inf, "过去分词");
    if(c.ppr) put(c.ppr, inf, "现在分词");
  }
  SIDX = { exact, plain, loose };
  return SIDX;
}

function lookupForm(q){
  const { exact, plain, loose } = buildIndex();
  const f = norm(q), fl = flat(q);
  return exact.get(f) || plain.get(fl) || loose.get(fl.replace(CLITIC, "")) || null;
}

function searchWords(q){
  const raw = String(q || "").trim();
  if(!raw) return [];
  const dq = flat(raw);
  const out = [], seen = new Set();
  const add = (w, via, label) => {
    if(!w || seen.has(w.fr)) return;
    seen.add(w.fr);
    out.push({ w, via, label });
  };

  // 1) 先当变位形式找一次
  const hit = lookupForm(raw);
  if(hit) add(WORDS.find(x => x.fr === hit.inf), hit.label === "原形" ? null : raw, hit.label);

  // 2) 再按单词本身和中文释义找
  const scored = [];
  for(const w of WORDS){
    const fr = baseOf(w.fr), zh = String(w.zh || "");
    let sc = -1;
    if(fr === dq) sc = 0;
    else if(dq && fr.startsWith(dq)) sc = 1;
    else if(dq && fr.includes(dq)) sc = 2;
    else if(zh.includes(raw)) sc = 3;
    if(sc >= 0) scored.push([sc, w]);
  }
  scored.sort((a, b) => a[0] - b[0] || a[1].fr.length - b[1].fr.length);
  scored.forEach(([, w]) => add(w, null, null));
  return out.slice(0, 50);
}

function searchResultsHTML(raw, res){
  if(!raw.trim())
    return `<div class="shint">输一个词就开始找。<br>

      也可以输变位形式（<b>suis</b>、<b>vont</b>、<b>allée</b>），会自动告诉你原形是哪个动词。</div>`;

/* ---------------- 答对的小庆祝 ----------------
   彩条 + 让答题元素弹一下。传元素或选择器都行。
   注意：「认识 / 不认识」那种自己说了算的题不调用它——没有对错，庆祝就没意义。 */
const CFC = ["#3f7d6e", "#7fb69f", "#f0b429", "#e0616b", "#6c8ae4", "#f19cbb"];
let cfTimer = 0;

function celebrate(target){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const el = typeof target === "string" ? document.querySelector(target) : target;
  if(el){
    el.classList.remove("bounce");
    void el.offsetWidth;                 // 强制重排，连着点也能重新播放动画
    el.classList.add("bounce");
  }

  let box = document.getElementById("confetti");
  if(!box){ box = document.createElement("div"); box.id = "confetti"; document.body.appendChild(box); }
  for(let i = 0; i < 26; i++){
    const p = document.createElement("i");
    p.className = "cfp";
    p.style.left = (Math.random() * 100).toFixed(1) + "vw";
    p.style.width = (6 + Math.random() * 6).toFixed(0) + "px";
    p.style.height = (10 + Math.random() * 8).toFixed(0) + "px";
    p.style.background = CFC[i % CFC.length];
    p.style.animation = "cfall " + (1.1 + Math.random() * 0.8).toFixed(2) + "s linear "
                      + (Math.random() * 0.18).toFixed(2) + "s forwards";
    box.appendChild(p);
  }
  clearTimeout(cfTimer);
  cfTimer = setTimeout(()=>{ box.innerHTML = ""; }, 2400);
}

/* ---------------- 复习会话：整课三遍 ---------------- */
function startLesson(n, keep){
  const q = shuffle(WORDS.filter(w=>w.s===n));
  const saved = store.lessons[n];
  let round = 0, i = 0, outcomes = {};
  if(keep && saved && !saved.done){
    round = Math.min(saved.round||0, 2);
    i = Math.min(saved.i||0, q.length-1);
    outcomes = saved.outcomes || {};
  }
  startQueue(q, "第" + n + "课", "lesson", n, {round, i, outcomes});
}
function startQueue(list, title, mode, lesson, resume){
  const r = resume || {};
  const base = list.slice();
  S = { mode, lesson: lesson||null, title, base, list: base.slice(),
        round: r.round||0, i: r.i||0, passed: 0, outcomes: r.outcomes||{},
        revealed:false, result:null, picked:null, settledWords:{}, opts:[] };
  buildOpts();
  renderSession();
}
function buildOpts(){
  const w = S.list[S.i];
  const same = S.base.filter(x => x !== w);
  const others = WORDS.filter(x => x.s !== w.s);
  let zhList = shuffle(Array.from(new Set(same.map(x=>x.zh)))).slice(0, 3);
  if(zhList.length < 3){
    zhList = zhList.concat(shuffle(Array.from(new Set(others.map(x=>x.zh))))
                            .slice(0, 3 - zhList.length));
  }
  // 记下每个选项的中文对应的是哪个法语词，答错时要显示出来
  S.opts = shuffle([w.zh, ...zhList]).map(zh => {
    const src = zh === w.zh ? w
              : same.find(x => x.zh === zh) || others.find(x => x.zh === zh)
                || WORDS.find(x => x.zh === zh);
    return {zh, fr: src ? src.fr : "?", pos: src ? (src.pos || "") : ""};
  });
}
function saveLessonState(done){
  if(S.mode !== "lesson") return;
  if(done) store.lessons[S.lesson] = {round:2, i:S.base.length, outcomes:S.outcomes, done:true};
  else store.lessons[S.lesson] = {round:S.round, i:S.i, outcomes:S.outcomes, done:false};
  save();
}

function renderSession(){
  screen = "session";
  const w = S.list[S.i];
  const n = S.i+1, m = S.list.length;
  const pct = Math.round(((S.round + S.passed / S.base.length) / 3) * 100);
  const retry = S.list.length - S.base.length;

  let body = "";
  if(S.round === 0){
    body = `<div class="stage">
      <div class="word">${esc(w.fr)}</div>

      <button class="sound" id="spk">🔊 听发音</button>
      <div class="opts">${S.opts.map((o,k)=>
        `<button class="opt" data-opt="${k}" data-val="${esc(o.zh)}">${esc(o.zh)}</button>`).join("")}</div>
    </div>`;
  }else if(S.round === 1){
    body = `<div class="stage">
      <div class="word small">${esc(w.fr)}</div>
      <div class="pos">${esc(w.pos||"")}</div>
      <button class="sound" id="spk">🔊 听发音</button>
      <div class="excard">
        <div class="fr">${highlight(w.ex, w.fr)}</div>
        ${S.revealed?`<div class="zh">${esc(w.zh)}</div>`:""}
        <div class="exfoot"><button class="snd-mini" id="spkex">🔊 朗读整句</button></div>
      </div>
      ${S.revealed?"":`<button class="hint" id="hint">💡</button><div class="hintlbl">提示：看中文意思</div>`}
    </div>`;
  }else{
    body = `<div class="stage">
      <div class="word">${esc(w.fr)}</div>
      <div class="pos">${esc(w.pos||"")}</div>
      <button class="sound" id="spk">🔊 听发音</button>
      <div class="hintlbl" style="margin-top:34px">最后一遍：在没有提示的情况下判断</div>
    </div>`;
  }

  const roundBar = `<div class="rounds">${ROUND_NAME.map((t,k)=>
    `<span class="${k===S.round?"on":(k<S.round?"done":"")}">${t}${k<S.round?" ✓":""}</span>`).join("")}</div>`;

  app.innerHTML = `
  <div class="topbar">
    <div class="back" id="quit">‹</div>
    <div class="ttl">${esc(S.title)} · ${ROUND_NAME[S.round]} · ${ROUND_HINT[S.round]}</div>
    <button class="autobtn" id="autobtn" title="自动朗读：开/关">${AUTO?"🔊":"🔇"}</button>
    <div class="pill">${n}/${m}</div>
  </div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  ${roundBar}
  ${retry > 0 ? `<div class="retryhint">本遍还有 ${retry} 个词要重过 · 答错或选「不认识」的会排到后面再来</div>` : ""}
  ${body}
  ${S.round>0 ? `<div class="answers">
      <button class="btn yes" data-ans="know">认识</button>
      <button class="btn no" data-ans="dont">不认识</button>
    </div>` : `<div style="height:20px"></div>`}`;
  window.scrollTo(0,0);

  // 跳到新的卡片 → 自动读这个词
  const cardId = S.round + ":" + S.i;
  if(S.spokenCard !== cardId){ S.spokenCard = cardId; autoSpeak(w.fr); }

  const sp = document.getElementById("spk"); if(sp) sp.onclick = ()=>speak(w.fr);
  const sx = document.getElementById("spkex"); if(sx) sx.onclick = ()=>speak(w.ex);
  const ab = document.getElementById("autobtn");
  if(ab) ab.onclick = ()=>{ setAuto(!AUTO); if(AUTO) autoSpeak(w.fr); renderSession(); };
  const hb = document.getElementById("hint"); if(hb) hb.onclick = ()=>{ S.revealed=true; renderSession(); };
  document.getElementById("quit").onclick = ()=>{ saveLessonState(false); renderHome(); };

  app.querySelectorAll("[data-opt]").forEach(b=>{
    b.onclick = ()=>{
      const idx = parseInt(b.dataset.opt, 10);
      const ok = S.opts[idx].zh === w.zh;
      S.picked = idx;
      app.querySelectorAll("[data-opt]").forEach(x=>{
        if(x.dataset.val === w.zh) x.classList.add("right");
        x.disabled = true;
      });
      if(!ok) b.classList.add("wrong");
      else celebrate(b);        // 只有第一遍是选择题（第二、三遍是自己判断，不庆祝）
      S.result = ok ? "know" : "dont";
      setTimeout(renderDetail, ok ? 260 : 520);
    };
  });
  app.querySelectorAll("[data-ans]").forEach(b=>{
    b.onclick = ()=>{ S.result = b.dataset.ans; renderDetail(); };
  });
}

function wireTense(w, reRender){
  document.getElementById("spk2").onclick = ()=>speak(w.fr);

// 第一遍答错时，把四个选项分别对应哪个法语词列出来
function optsBlock(){
  if(S.round !== 0 || S.result !== "dont" || !S.opts.length) return "";
  const w = S.list[S.i];
  let html = `<div class="block"><h3>四个选项分别是什么词</h3><div class="optlist">`;
  S.opts.forEach((o, k)=>{
    const isRight = o.zh === w.zh, isMine = k === S.picked;
    const cls = isRight ? "ok" : (isMine ? "bad" : "");
    html += `<div class="orow ${cls}">
      <span class="mk">${isRight ? "✓" : (isMine ? "✗" : "")}</span>
      <span class="zh">${esc(o.zh)}</span>
      <span class="fr2">${esc(o.fr)}<span class="pos2">${esc(o.pos)}</span></span>
    </div>`;
  });
  return html + `</div></div>`;
}

function renderDetail(){
  screen = "detail";
  const w = S.list[S.i], k = wkey(w);
  // 记录这个词这一遍的结果（整课跑完后统一结算）
  if(S.result === "dont") S.outcomes[k] = false;
  else if(S.outcomes[k] !== false) S.outcomes[k] = true;

  const passed = S.result === "know";
  // 第三遍答对时才结算（答错的会重新排队，等最后一次答对再算）
  if(S.round === 2 && passed && !S.settledWords[k]){
    S.settledWords[k] = true;
    finishWord(w, S.outcomes[k] !== false);
  }

  let status = "";
  if(S.round === 2 && passed){
    status = `<div class="srsline">${S.outcomes[k] !== false ? "三遍全对 ✓ " : "中间答错过，已进错词本 · "}${dueLabel(w)}</div>`;
  }else if(!passed){
    status = `<div class="srsline retry">这个词待会儿还会再出现，直到你答对为止</div>`;
  }

  app.innerHTML = `
  <div class="topbar">
    <div class="back" id="next">›</div>
    <div class="ttl">${S.result==="know" ? "✅ 答对了" : "📌 答错 / 不认识"}</div>
    <div class="pill">${ROUND_NAME[S.round]}</div>
  </div>
  <div class="detail">
    ${detailBody(w, S.tense)}
    ${optsBlock()}
    ${status}
    <div class="footer">
      <button class="btn primary wide" id="next2">继续 ›</button>
      <button class="btn ghost wide" id="wbt">${isWrong(w) ? "从错词本移除" : "加入错词本"}</button>
      <div class="note">${S.round<2 ? "这个词后面还有 "+(2-S.round)+" 遍" : "这个词三遍都过了"}</div>
    </div>
  </div>`;
  window.scrollTo(0,0);
  // 跳到详情页 → 也自动读一遍这个词
  const dId = "d" + S.round + ":" + S.i;
  if(S.spokenDetail !== dId){ S.spokenDetail = dId; autoSpeak(w.fr); }
  wireTense(w, t=>{ S.tense = t; renderDetail(); });
  document.getElementById("next").onclick = advance;
  document.getElementById("next2").onclick = advance;
  document.getElementById("wbt").onclick = ()=>{
    if(store.wrong[k]) delete store.wrong[k];
    else store.wrong[k] = { n: (rec(w) && rec(w).wrong) || 0 };
    save(); renderDetail();
  };
}

/* ---------------- 推进（答错 / 不认识 → 排到队尾重来） ---------------- */
function advance(){
  const w = S.list[S.i];
  const passed = S.result === "know";
  if(passed) S.passed++;
  else S.list.push(w);               // 这一遍没过 → 放到后面，直到答对 / 选「认识」为止

  S.i++;
  S.revealed = false; S.result = null; S.picked = null;

  if(S.i < S.list.length){           // 本遍还没走完
    if(S.round === 0) buildOpts();
    saveLessonState(false);
    renderSession();
    return;
  }
  if(S.round < 2){                   // 本遍走完 → 进入下一遍
    S.round++; S.i = 0; S.passed = 0; S.list = S.base.slice();
    saveLessonState(false);
    renderRoundDone();
    return;
  }
  saveLessonState(true);             // 三遍都走完
  renderFinish();
}
