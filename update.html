<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>法语单词 · 更新</title>
<style>
  :root{--brand:#3f7d6e;--line:#e2e8ef;--ink:#1b2430;--ink2:#5a6675;--ink3:#93a0ae}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:linear-gradient(180deg,#eef3f7,#e9eef6 60%,#f6eef0);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:36px 20px}
  h1{font-size:24px;margin:0 0 8px}
  p{color:var(--ink2);line-height:1.75;font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px;
    box-shadow:0 6px 24px rgba(30,50,80,.07)}
  button{border:none;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:600;width:100%;
    background:var(--brand);color:#fff;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.55}
  .msg{margin-top:12px;font-size:13px;color:var(--ink2);line-height:1.7;white-space:pre-wrap}
  .tips{margin-top:16px;font-size:12.5px;color:var(--ink3);line-height:1.8}
  a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <h1>法语单词 · 更新</h1>
  <p>下载后直接打开安装包，会<b>覆盖旧版本</b>，学习进度、错词本会保留。</p>
  <div class="card">
    <p style="margin-top:0">当前提供版本：<b id="ver">读取中…</b></p>
    <button id="dl" disabled>下载并安装</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="tips">
    · 下载完成后在通知栏或「下载」里点开 APK 安装；<br>
    · 如果提示「不允许安装未知应用」，按提示给浏览器授权；<br>
    · 安装时不要先卸载旧版，覆盖安装才能保留进度。
  </div>
</div>
<script>
let V = null;
const $ = id => document.getElementById(id);
const msg = t => { $("msg").textContent = t; };

fetch("version.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.json())
  .then(v => {
    V = v;
    const mb = v.size ? Math.round(v.size / 1048576) : "";
    $("ver").textContent = (v.name || v.code || "?") + (mb ? "（约 " + mb + " MB）" : "");
    $("dl").disabled = false;
    $("dl").textContent = "下载并安装" + (mb ? "（约 " + mb + " MB）" : "");
  })
  .catch(() => {
    $("ver").textContent = "读取失败";
    msg("读取版本信息失败，请检查网络后刷新。");
  });

$("dl").onclick = async () => {
  if(!V || !Array.isArray(V.parts) || !V.parts.length){ msg("没有可下载的文件。"); return; }
  $("dl").disabled = true;
  const chunks = [];
  let got = 0;
  try{
    for(const p of V.parts){
      const r = await fetch(p + (p.indexOf("?") >= 0 ? "&" : "?") + "v=" + encodeURIComponent(V.code || 0),
                           { cache: "no-store" });
      if(!r.ok) throw new Error("下载失败：" + p + "（" + r.status + "）");
      const reader = r.body.getReader();
      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        chunks.push(value);
        got += value.length;
        msg("已下载 " + (got / 1048576).toFixed(1) + " MB…");
      }
    }
    const blob = new Blob(chunks, { type: "application/vnd.android.package-archive" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "法语单词-" + (V.name || V.code) + ".apk";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
    msg("下载完成。请在通知栏或「下载」里点开安装包，覆盖安装即可。");
  }catch(e){
    msg("下载失败：" + e.message + "\n可以刷新重试，或用电脑打开本页下载。");
    $("dl").disabled = false;
  }
};
</script>
</body>
</html>
