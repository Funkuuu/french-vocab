/* ---- 连续朗读整篇课文 ---- */
function textoLines(t){
  return t.parts.filter(p => p.type !== "form").flatMap(p => p.lines.map(l => l[0]));
}

let PA = null;      // {n, ti, lines, i, stopped, whole}

function startPlayAll(n, ti, lines){
  stopAll();
  PA = {n, ti, lines, i: 0, stopped: false, whole: false};
  paLabel(true, ti);
  // 先看有没有「整篇一整段」的音频；没有就退回逐句连播
  const full = lines.map(speakText).filter(Boolean).join(" ").trim();
  if(full && (inlineAudio(full) || !AUDIO_MISSING.has(full))){
    PA.whole = true;
    playText(full,
      ()=>{ if(PA){ const t = PA.ti; PA = null; paLabel(false, t); } },
      ()=>{ if(PA){ AUDIO_MISSING.add(full); PA.whole = false; paStep(); } });
    return;
  }
  paStep();
}

function paStep(){
  if(!PA || PA.stopped) return;
  if(PA.i >= PA.lines.length){
    const ti = PA.ti;
    PA = null;
    document.querySelectorAll(".tline.playing").forEach(e=>e.classList.remove("playing"));
    paLabel(false, ti);
    return;
  }
  const sel = '.tline[data-i="' + PA.ti + ":" + PA.i + '"]';
  document.querySelectorAll(".tline.playing").forEach(e=>e.classList.remove("playing"));
  const el = document.querySelector(sel);
  if(el){
    el.classList.add("playing");
    el.scrollIntoView({block: "center", behavior: "smooth"});
  }
  const line = PA.lines[PA.i];
  playText(speakText(line), ()=>{ if(PA){ PA.i++; paStep(); } });
}

function stopAll(){
  if(PA){ PA.stopped = true; PA = null; }
  if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio = null; }
  if(window.speechSynthesis) speechSynthesis.cancel();
  // 课文播放器也停掉
  if(PL_CUR !== null){
    const o = PL.get(PL_CUR);
    if(o) o.audio.pause();
    const b = document.querySelector('.player[data-p="' + PL_CUR + '"] .pl-play');
    if(b) b.textContent = "▶";
    PL_CUR = null;
  }
  document.querySelectorAll(".tline.playing").forEach(e=>e.classList.remove("playing"));
  document.querySelectorAll(".js-playall").forEach(b => {
    b.textContent = "▶ 听全文（连续播放，这一段没有进度条）";
  });
}

function paLabel(playing, ti){
  const b = document.querySelector('.js-playall[data-playall="' + ti + '"]');
  if(b) b.textContent = playing ? "⏹ 停止播放" : "▶ 听全文（连续播放）";
}

// 播一条；本地音频优先，都没有时：给了 onFail 就交给调用方，否则用系统语音
function playText(text, onEnd, onFail){
  if(!text){ onEnd(); return; }
  let done = false;
  const finish = ()=>{ if(!done){ done = true; onEnd(); } };
  const fail = ()=>{ if(!done){ done = true; (onFail || onEnd)(); } };

  const b64 = inlineAudio(text);
  if(b64){
    try{
      const a = new Audio("data:audio/mpeg;base64," + b64);
      curAudio = a; AUDIO_MODE = "local";
      a.addEventListener("ended", finish);
      a.addEventListener("error", fail);
      a.play().catch(fail);
      return;
    }catch(e){}
  }
  if(!AUDIO_MISSING.has(text)){
    try{
      const a = new Audio(AUDIO_DIR + audioKey(text) + ".mp3");
      curAudio = a;
      a.addEventListener("ended", finish);
      a.addEventListener("error", ()=>{ AUDIO_MISSING.add(text); fail(); });
      a.play().catch(fail);
      return;
    }catch(e){}
  }
  if(onFail){ fail(); return; }        // 没有本地音频 → 调用方决定
  ttsSeq(text, finish);
}

function ttsSeq(text, onEnd){
  if(!window.speechSynthesis){ onEnd(); return; }
  if(!VOICE.fr) VOICE.fr = pickFrVoice();
  if(!VOICE.fr){ onEnd(); return; }
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.voice = VOICE.fr; u.lang = VOICE.fr.lang; u.rate = 0.8;
    u.addEventListener("end", onEnd);
    u.addEventListener("error", onEnd);
    speechSynthesis.speak(u);
  }catch(e){ onEnd(); }
}

/* ================= 小游戏 1/2：填空、句子排序（共用一套拖拽） ================= */

/* ---- 通用拖拽 ----
   payload 随便什么，拖完回调 onEnd(目标 key, 是否真的拖动过)
   目标 key： "slot:xxx" 某个槽 / "pool" 池子 / null 丢在空白处（当成池子） */
let DRAG = null, LAST_DROP = 0;

function dragBegin(ev, payload, ghostText, onEnd){
  if(ev.button != null && ev.button !== 0) return;
  ev.preventDefault();
  const g = document.createElement("div");
  g.className = "czdrag";
  g.textContent = ghostText;
  g.style.left = ev.clientX + "px";
  g.style.top = ev.clientY + "px";
  document.body.appendChild(g);
  DRAG = {payload, g, sx: ev.clientX, sy: ev.clientY, moved: false, onEnd};
  window.addEventListener("pointermove", dragMove);
  window.addEventListener("pointerup", dragDone);
  window.addEventListener("pointercancel", dragDone);
}

function dragDone(ev){
  if(!DRAG) return;
  window.removeEventListener("pointermove", dragMove);
  window.removeEventListener("pointerup", dragDone);
  window.removeEventListener("pointercancel", dragDone);
  const d = DRAG; DRAG = null; LAST_DROP = Date.now();
  if(d.g.parentNode) d.g.parentNode.removeChild(d.g);
  document.querySelectorAll(".drop-hit").forEach(e=>e.classList.remove("drop-hit"));
  if(!d.moved){ d.onEnd(null, false); return; }        // 只是点了一下，不当拖动
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const t = el && el.closest ? el.closest("[data-drop]") : null;
  d.onEnd(t ? t.dataset.drop : null, true);
}

function dragMove(ev){
  if(!DRAG) return;
  if(Math.abs(ev.clientX - DRAG.sx) + Math.abs(ev.clientY - DRAG.sy) > 6) DRAG.moved = true;
  DRAG.g.style.left = ev.clientX + "px";
  DRAG.g.style.top = ev.clientY + "px";
  document.querySelectorAll(".drop-hit").forEach(e=>e.classList.remove("drop-hit"));
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const t = el && el.closest ? el.closest("[data-drop]") : null;
  if(t) t.classList.add("drop-hit");
}

/* ================= 小游戏 1：填空（拖拽 / 点选 + 检查） ================= */
const STOP = new Set(("le la les l un une des de du au aux et ou à en dans sur sous pour par avec sans que qui ce cet cette ces il elle ils elles je tu nous vous on se son sa ses leur leurs ne pas plus est sont a ai as ont être avoir mais donc car si tout tous toute toutes comme").split(" "));

const czClean = s => s.toLowerCase().replace(/[^a-zà-ÿœ]/g, "");
// 把 "Bonjour." 拆成 前缀/词/后缀，挖空时只挖中间的词，标点留在外面
function czSplit(tk){
  const m = tk.match(/^([^\p{L}]*)([\s\S]*?)([^\p{L}]*)$/u);
  return m ? {pre: m[1], core: m[2], post: m[3]} : {pre: "", core: tk, post: ""};
}

// 本课单词表里的词干（用来决定挖哪些空——不随机）
function vocabStems(n){
  const set = new Set();
  WORDS.filter(w => w.s === n).forEach(w=>{
    w.fr.toLowerCase().replace(/[^a-zà-ÿœ'\- ]/g, " ").split(/[\s'\-]+/).forEach(b=>{
      if(b.length >= 4) set.add(b);
    });
  });
  return set;
}

function startCloze(n, ti, pi){
  const t = textsFor(n)[ti], part = t.parts[pi];
  const raw = part.lines.map(l => l[0].trim());
  const toks = raw.map(line => line.split(/(\s+)/).filter(s => s !== ""));
  const stems = vocabStems(n);

  // 1) 先挖「本课单词表里出现过的词」；2) 不够就挖较长的实词。都是确定性的，每次一样。
  const grab = pick => {
    const out = [];
    toks.forEach((line, li)=> line.forEach((tk, tki)=>{
      const c = czClean(tk);
      if(c.length < 4) return;
      const nextTok = line.slice(tki + 1).find(x => x.trim() !== "");
      if((nextTok || "").trim() === ":" || tk.trim().endsWith(":")) return;   // 说话人标签不挖
      const core = czSplit(tk).core;
      if(tki > 0 && /^[A-ZÀ-ÞŒ]/.test(core)) return;      // 句子中的专有名词不挖
      if(pick(c)) out.push({li, tki, core});
    }));
    return out;
  };
  const stemList = [...stems];
  let hits = grab(c => stems.has(c) ||
        stemList.some(s => s.length >= 5 && c.startsWith(s.slice(0, 5))));
  if(hits.length < 4) hits = grab(c => c.length >= 5 && !STOP.has(c));

  const MAX = 12;
  let chosen = hits;
  if(hits.length > MAX){                 // 太多就先挑长词，再按文中顺序排回去
    chosen = hits.slice().sort((a, b) => czClean(b.core).length - czClean(a.core).length)
                 .slice(0, MAX)
                 .sort((a, b) => (a.li - b.li) || (a.tki - b.tki));
  }

  const blanks = new Map();
  chosen.forEach(h => blanks.set(h.li + ":" + h.tki, h.core));
  const answers = chosen.map(h => h.core);

  // 词库里掺几个本课单词表里的真实法语词做干扰项
  const usedAns = new Set(answers.map(czClean));
  const distrPool = Array.from(new Set(WORDS.filter(w => w.s === n)
      .map(w => (w.fr.match(/[A-Za-zÀ-ÿŒœ]+(?:'[A-Za-zÀ-ÿŒœ]+)?/) || [""])[0])
      .filter(x => x.length >= 4 && !usedAns.has(czClean(x)))));
  const distr = shuffle(distrPool).slice(0, Math.max(2, Math.round(answers.length / 3)));
  const bank = shuffle([...answers, ...distr]).map((text, id) => ({id, text}));

  CLOZE = { n, ti, pi, title: t.title, label: part.label, toks, blanks,
            order: [...blanks.keys()], placed: {}, bank, checked: false, results: {} };
  renderCloze(true);
}

function czBankText(id){ return (CLOZE.bank.find(b => b.id === id) || {}).text || ""; }

function czPlace(id, key){          // 放进某个空；那个空已经有词就交换
  const C = CLOZE;
  C.checked = false; C.results = {};
  let from = null;
  for(const k of C.order) if(C.placed[k] === id){ from = k; break; }
  if(key == null){
    key = C.order.find(k => C.placed[k] == null);
    if(key == null) return;
  }
  if(from === key) return;
  const occ = C.placed[key] || null;
  if(from !== null) delete C.placed[from];
  C.placed[key] = id;
  if(occ != null && occ !== id && from !== null) C.placed[from] = occ;   // 两个已放好的换位置
  renderCloze(false);
}

function czToPool(id){              // 拿回词库
  const C = CLOZE;
  for(const k of C.order) if(C.placed[k] === id) delete C.placed[k];
  C.checked = false; C.results = {};
  renderCloze(false);
}

function renderCloze(fresh){
  screen = "cloze";
  const C = CLOZE;
  const filled = C.order.filter(k => C.placed[k] != null).length;
  const done = filled === C.order.length;

  let body = "";
  C.toks.forEach((line, li)=>{
    body += `<div class="czline">`;
    line.forEach((tok, tk)=>{
      const key = li + ":" + tk;
      if(C.blanks.has(key)){
        const id = C.placed[key];
        const txt = id != null ? czBankText(id) : "";
        let cls = txt ? "full" : "";
        if(C.checked && C.results[key] != null) cls = C.results[key] ? "ok" : "no";
        const sp = czSplit(tok);        // 标点留在空格外边
        body += esc(sp.pre)
              + `<span class="czslot ${cls}" data-drop="slot:${key}" data-slot="${key}">${txt ? esc(txt) : ""}</span>`
              + esc(sp.post);
      }else{
        body += esc(tok);
      }
    });
    body += `</div>`;
  });

  const usedIds = new Set(Object.values(C.placed).filter(v => v != null));

  app.innerHTML = `
  <div class="topbar"><div class="back" id="back">‹</div>
    <div class="ttl">填空 · ${esc(C.label)}</div>
    <div class="pill">${filled}/${C.order.length}</div></div>
  <div class="ghead"><h1>${esc(C.title)}</h1>
    <div class="sub">把词拖进空里。已经放好的也能再拖到别的空——拖到有词的空上，两个就换位置。
      手机上点一下词也能放，点已填的空可以拿出来。</div></div>
  <div class="tex">
    <div class="gblock">${body}</div>
    <div class="czbank" data-drop="pool">${C.bank.map(b =>
      `<button class="czword ${usedIds.has(b.id) ? "used" : ""}" data-w="${b.id}">${esc(b.text)}</button>`).join("")}</div>
    <div class="czfoot">
      ${ C.checked
          ? `<div class="czres ${C.allOk ? "ok" : "no"}">${C.allOk ? "✅ 对" : "❌ 不对"}</div>
             <button class="btn ghost" id="czagain">再试一次</button>
             ${C.allOk ? "" : `<button class="btn ghost" id="czreveal">看答案</button>`}
             <button class="btn primary" id="czback">回到课文</button>`
          : `<button class="btn ${done ? "primary" : "ghost"}" id="czcheck" ${done ? "" : "disabled"}>检查</button>
             ${done ? "" : `<div class="note" style="padding:0">还有 ${C.order.length - filled} 个空没填</div>`}` }
    </div>
  </div>`;
  if(fresh) window.scrollTo(0,0);

  document.getElementById("back").onclick = ()=>renderTexteLesson(C.n);

  const ck = document.getElementById("czcheck");
  if(ck) ck.onclick = ()=>{
    C.results = {}; C.allOk = true;
    C.order.forEach(k=>{
      const id = C.placed[k];
      const ok = id != null && czBankText(id) === C.blanks.get(k);
      C.results[k] = ok;
      if(!ok) C.allOk = false;
    });
    C.checked = true;
    renderCloze(false);
    if(C.allOk) celebrate(".czres.ok, #czcheck");
  };
  const ag = document.getElementById("czagain");
  if(ag) ag.onclick = ()=>startCloze(C.n, C.ti, C.pi);
  const rv = document.getElementById("czreveal");
  if(rv) rv.onclick = ()=>{                    // 看答案：把正确答案填进去
    C.results = {};
    const used = new Set(Object.values(C.placed).filter(v => v != null));
    C.order.forEach(k=>{
      const want = C.blanks.get(k);
      if(czBankText(C.placed[k]) === want){ C.results[k] = true; return; }
      const cand = C.bank.find(b => b.text === want && !used.has(b.id));
      if(cand){ C.placed[k] = cand.id; used.add(cand.id); C.results[k] = true; }
      else C.results[k] = false;
    });
    C.allOk = true; C.checked = true;
    renderCloze(false);
  };
  const bk = document.getElementById("czback");
  if(bk) bk.onclick = ()=>renderTexteLesson(C.n);

  // 已填的空：可以拖走，也可以点一下拿出来
  app.querySelectorAll(".czslot.full").forEach(s=>{
    const key = s.dataset.slot, id = C.placed[key];
    s.addEventListener("pointerdown", ev=>{
      dragBegin(ev, {id, fromSlot: true}, czBankText(id), (target, moved)=>{
        if(!moved){ czToPool(id); return; }                       // 点一下 = 拿出来
        if(target && target.indexOf("slot:") === 0) czPlace(id, target.slice(5));
        else czToPool(id);                                        // 拖到池子或空白 = 拿出来
      });
    });
  });
  // 词库里的词：拖进空里；轻点 = 放进第一个空位
  app.querySelectorAll("[data-w]").forEach(el=>{
    const id = parseInt(el.dataset.w, 10);
    el.addEventListener("pointerdown", ev=>{
      dragBegin(ev, {id, fromSlot: false}, czBankText(id), (target, moved)=>{
        if(!moved){ czPlace(id, null); return; }
        if(target && target.indexOf("slot:") === 0) czPlace(id, target.slice(5));
      });
    });
  });
}

/* ================= 小游戏 2：句子排序（拖拽 + 交换） ================= */
function startOrder(n, ti, pi){
  const t = textsFor(n)[ti], part = t.parts[pi];
  const lines = part.lines.map((l, i)=>({i, fr: l[0].trim(), zh: l[1] || ""}));
  ORDER = {
    n, ti, pi, title: t.title, label: part.label,
    lines,
    slots: lines.map(()=>null),                       // 每个位置放的是哪一句（存原始下标）
    pool: shuffle(lines.map(l => l.i)),               // 还没放的
    checked: false, results: []
  };
  renderOrder(true);
}

function orderPlace(idx, fromSlot, toSlot){
  const O = ORDER;
  if(fromSlot === toSlot) return;
  const occ = O.slots[toSlot];
  if(fromSlot !== null) O.slots[fromSlot] = occ;       // 原来那格接住对方 → 交换
  else if(occ != null) O.pool.push(occ);               // 从池子来的，占位的那句回池子
  O.slots[toSlot] = idx;
  O.pool = O.pool.filter(x => x !== idx);
  O.checked = false;
  renderOrder(false);
}

function orderToPool(idx, fromSlot){
  const O = ORDER;
  if(fromSlot !== null) O.slots[fromSlot] = null;
  if(!O.pool.includes(idx)) O.pool.push(idx);
  O.checked = false;
  renderOrder(false);
}

function renderOrder(fresh){
  screen = "order";
  const O = ORDER;
  const filled = O.slots.filter(v => v != null).length;
  const all = filled === O.lines.length;
  const ok = all && O.slots.every((v, k) => v === k);

  const lineHtml = (idx, cls) => {
    const L = O.lines[idx];
    return `<div class="oitem ${cls}">
      <span class="otxt">${esc(L.fr)}</span>
      ${showZh && L.zh ? `<span class="zh">${esc(L.zh)}</span>` : ""}</div>`;
  };

  let slots = "";
  O.slots.forEach((v, k)=>{
    let cls = v != null ? "full" : "";
    if(O.checked) cls = (O.results[k] ? "ok" : (v == null ? "" : "no"));
    slots += `<div class="oslot ${cls}" data-drop="slot:${k}">
      <span class="onum">${k+1}</span>
      ${v == null ? `<span class="oempty">把句子拖到这里</span>`
                  : `<span class="oslot-in">${lineHtml(v, "")}</span>`}
    </div>`;
  });

  app.innerHTML = `
  <div class="topbar"><div class="back" id="back">‹</div>
    <div class="ttl">排序 · ${esc(O.label)}</div>
    <div class="pill">${filled}/${O.lines.length}</div></div>
  <div class="ghead"><h1>${esc(O.title)}</h1>
    <div class="sub">${O.checked
      ? (ok ? "顺序完全正确 🎉" : "顺序不对，红色的地方再看看")
      : "把句子按正确顺序拖到左边的位置里。已经放好的也能再拖走；拖到已占用的位置，两个会交换。"}</div></div>
  <div class="tex">
    <div class="gblock">${slots}</div>
    ${O.pool.length ? `<div class="opool" data-drop="pool">${
        O.pool.map(i => `<div data-o="${i}">${lineHtml(i, "")}</div>`).join("")
      }</div>` : `<div class="opool" data-drop="pool"><div class="oempty" style="padding:10px">都放上去了</div></div>`}
    <div class="czfoot">
      ${ O.checked
          ? `<div class="czres ${ok ? "ok" : "no"}">${ok ? "✅ 对" : "❌ 不对"}</div>
             <button class="btn ghost" id="oragain">重来一次</button>
             <button class="btn primary" id="orback">回到课文</button>`
          : `<button class="btn ${all ? "primary" : "ghost"}" id="orcheck" ${all ? "" : "disabled"}>检查</button>
             ${all ? "" : `<div class="note" style="padding:0">还有 ${O.lines.length - filled} 句没放</div>`}` }
    </div>
  </div>`;
  if(fresh) window.scrollTo(0,0);

  document.getElementById("back").onclick = ()=>renderTexteLesson(O.n);
  const ck = document.getElementById("orcheck");
  if(ck) ck.onclick = ()=>{
    O.results = O.slots.map((v, k) => v === k);
    O.checked = true;
    renderOrder(false);
    if(O.results.every(Boolean)) celebrate(".czres.ok, #orcheck");
  };
  const ag = document.getElementById("oragain");
  if(ag) ag.onclick = ()=>startOrder(O.n, O.ti, O.pi);
  const bk = document.getElementById("orback");
  if(bk) bk.onclick = ()=>renderTexteLesson(O.n);

  // 位置格里的句子：可以继续拖走 / 点一下拿回下面
  app.querySelectorAll(".oslot.full").forEach(s=>{
    const k = parseInt(s.dataset.drop.slice(5), 10);
    const idx = O.slots[k];
    s.addEventListener("pointerdown", ev=>{
      dragBegin(ev, {idx, fromSlot: k}, O.lines[idx].fr, (target, moved)=>{
        if(!moved){ orderToPool(idx, k); return; }
        if(target && target.indexOf("slot:") === 0){
          const to = parseInt(target.slice(5), 10);
          if(O.checked) return;
          orderPlace(idx, k, to);
        }else if(!O.checked) orderToPool(idx, k);
      });
    });
  });
  // 池子里的句子
  app.querySelectorAll("[data-o]").forEach(el=>{
    const idx = parseInt(el.dataset.o, 10);
    el.addEventListener("pointerdown", ev=>{
      dragBegin(ev, {idx, fromSlot: null}, O.lines[idx].fr, (target, moved)=>{
        const put = to => { if(O.checked) return; orderPlace(idx, null, to); };
        if(!moved){                                   // 轻点 → 放进第一个空位
          const first = O.slots.findIndex(v => v == null);
          if(first >= 0) put(first);
          return;
        }
        if(target && target.indexOf("slot:") === 0) put(parseInt(target.slice(5), 10));
      });
    });
  });
}

/* ---- 课文全文播放器：倍速 + 可拖动进度条 ---- */
const PL = new Map();          // ti -> {audio, ready, dead}
let PL_CUR = null;             // 当前在放哪一篇（同时只允许一个在放）

const plFmt = s => (!isFinite(s) || s < 0) ? "0:00"
  : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

function plSource(lines){
  const full = lines.map(speakText).filter(Boolean).join(" ").trim();
  const b64 = inlineAudio(full);
  return {full, url: b64 ? ("data:audio/mpeg;base64," + b64) : (AUDIO_DIR + audioKey(full) + ".mp3")};
}

function plWire(n, ti, el, lines){
  if(!lines || !lines.length) return;
  const key = n + ":" + ti;          // 必须带课号，不然不同课的第 0 篇会撞车
  const btn = el.querySelector(".pl-play");
  const seek = el.querySelector(".pl-seek");
  const time = el.querySelector(".pl-t");
  let dragging = false;

  let o = PL.get(key);
  const paint = ()=>{
    if(!o || o.dead) return;
    const a = o.audio;
    if(a.duration && !dragging) seek.value = Math.round(a.currentTime / a.duration * 1000);
    time.textContent = plFmt(a.currentTime) + " / " + (a.duration ? plFmt(a.duration) : "0:00");
  };

  if(!o){
    const {full, url} = plSource(lines);
    const a = new Audio();
    a.preload = "metadata";
    a.src = url;
    o = {audio: a, ready: false, dead: false, full};
    a.addEventListener("loadedmetadata", ()=>{ o.ready = true; paint(); });
    a.addEventListener("timeupdate", paint);
    a.addEventListener("ended", ()=>{ btn.textContent = "▶"; PL_CUR = null; });
    a.addEventListener("error", ()=>{ o.dead = true; PL.delete(key); plFallback(n, ti, el, lines); });
    PL.set(key, o);
  }
  const a = o.audio;

  btn.onclick = ()=>{
    if(PL_CUR !== null && PL_CUR !== key){                 // 停掉上一篇
      const prev = PL.get(PL_CUR);
      if(prev) prev.audio.pause();
      const pb = document.querySelector('.player[data-p="' + PL_CUR + '"] .pl-play');
      if(pb) pb.textContent = "▶";
    }
    if(a.paused){
      btn.classList.add("wait");
      a.play().then(()=>{
        btn.classList.remove("wait");
        btn.textContent = "⏸";
        PL_CUR = key;
      }).catch(()=>{ btn.classList.remove("wait"); btn.textContent = "▶"; });
    }else{
      a.pause();
      btn.textContent = "▶";
      if(PL_CUR === key) PL_CUR = null;
    }
  };

  seek.addEventListener("pointerdown", ()=>{ dragging = true; });
  seek.addEventListener("pointerup", ()=>{ dragging = false; });
  seek.addEventListener("pointercancel", ()=>{ dragging = false; });
  seek.addEventListener("change", ()=>{ dragging = false; });
  seek.addEventListener("input", ()=>{
    if(a.duration){ a.currentTime = seek.value / 1000 * a.duration; paint(); }
  });

  el.querySelectorAll(".pl-rate").forEach(b=>{
    b.onclick = ()=>{
      a.playbackRate = parseFloat(b.dataset.rate);
      el.querySelectorAll(".pl-rate").forEach(x=> x.classList.toggle("on", x === b));
    };
  });
}

// 整段音频拿不到（没生成/没带 audio 文件夹）→ 退回逐句连播，只是没有进度条
function plFallback(n, ti, el, lines){
  const key = n + ":" + ti;
  el.outerHTML = `<div class="tbar" style="padding:2px 0 8px">
    <button class="chipbtn js-playall" data-key="${key}">▶ 听全文（连续播放，这一段没有进度条）</button></div>`;
  const b = document.querySelector('.js-playall[data-key="' + key + '"]');
  if(b) b.onclick = ()=>{
    if(PA && PA.ti === ti){ stopAll(); return; }
    if(AUDIO_MODE === "tts" && !VOICE.fr){
      toast("没有本地音频，系统里也没有法语语音，读不了。");
      return;
    }
    startPlayAll(n, ti, lines);
  };
}

/* ---------------- 情境句练习：变位 / 名词阴阳性 / 形容词阴阳性 ---------------- */
const SENT_CONJ = DATA.sentConj || {};
const SENT_ADJ = DATA.sentAdj || {};
const SENT_NOUN = DATA.sentNoun || {};
const VERBS = WORDS.filter(w => CONJ[w.fr] && (CONJ[w.fr].pr || []).length === 6);

const NOUN_FAMILY = {
  "un": ["un","une","des","de la"], "une": ["un","une","des","de la"],
  "des": ["un","une","des","de la"],
  "le": ["le","la","l'","les"], "la": ["le","la","l'","les"],
  "l'": ["le","la","l'","les"], "les": ["le","la","l'","les"],
  "du": ["du","de la","de l'","des"], "de la": ["du","de la","de l'","des"],
  "de l'": ["du","de la","de l'","des"],
  "au": ["au","à la","à l'","aux"], "à la": ["au","à la","à l'","aux"],
  "à l'": ["au","à la","à l'","aux"], "aux": ["au","à la","à l'","aux"]
};

// 形容词：单词表里 fr 带逗号的才是有阴阳性变化的
const ADJ_LIST = WORDS.filter(w => /,/.test(w.fr) && /adj/.test(w.pos || ""))
  .map(w => {
    const m = w.fr.split(",")[0].trim();
    const d = SENT_ADJ[m];
    return d ? { lesson: w.s, m, zh: w.zh,
                 forms: Array.from(new Set([m, d.f, d.mp, d.fp])), sent: d.sent } : null;
  }).filter(Boolean);
const NOUN_LIST = WORDS.filter(w => SENT_NOUN[w.fr])
  .map(w => ({ lesson: w.s, n: w.fr, pos: w.pos || "", zh: w.zh, sent: SENT_NOUN[w.fr].s }));

/* 题库拼装 */
const sqConj = list => list.flatMap(w => (SENT_CONJ[w.fr] || [])
  .map(e => ({ kind: "conj", key: w.fr, s: e.s, a: e.a, zh: e.zh, i: e.i })));
const sqAdj = list => list.flatMap(d => d.sent
  .map(e => ({ kind: "adj", key: d.m, pos: "adj.", s: e.s, a: e.a, zh: e.zh, forms: d.forms })));
const sqNoun = list => list.flatMap(d => d.sent
  .map(e => ({ kind: "noun", key: d.n, pos: d.pos, s: e.s, a: e.a, zh: e.zh })));

const verbsForLesson = n => VERBS.filter(w => w.s === n);
const adjsForLesson = n => ADJ_LIST.filter(d => d.lesson === n);
const nounsForLesson = n => NOUN_LIST.filter(d => d.lesson === n);
const sqRight = (picked, q) => picked.toLowerCase() === q.a.toLowerCase();

/* ---- 答题 ---- */
let SQ = null;

function startSQ(list, title){
  screen = "sq";
  stopAll();
  SQ = { title, base: list.slice(), queue: shuffle(list.slice()),
         i: 0, q: null, picked: null, checked: false, ok: false,
         right: 0, wrong: 0, requeued: 0 };
  sqBuild();
  renderSQ(true);
}

function sqBuild(){
  const q = SQ.queue[SQ.i];
  let opts;
  if(q.kind === "conj"){
    const forms = CONJ[q.key].pr;
    const same = shuffle(forms.filter((f, k) => k !== q.i)).slice(0, 2);
    let other = "";
    // 借别的动词时，跟本题动词的「代词式与否」保持一致，选项格式才统一
    const wantPrn = !!CONJ[q.key].prn;
    const pool = VERBS.filter(v => !!CONJ[v.fr].prn === wantPrn);
    for(let n = 0; n < 24 && !other; n++){
      const cand = pool[Math.floor(Math.random() * pool.length)];
      if(cand.fr === q.key) continue;
      const f = CONJ[cand.fr].pr[q.i];
      if(f) other = f;
    }
    opts = Array.from(new Set([q.a, ...same, other].filter(Boolean))).slice(0, 4);
  }else if(q.kind === "adj"){
    opts = q.forms.slice();
  }else{
    opts = (NOUN_FAMILY[q.a.toLowerCase()] || ["un", "une", "des", "le"]).slice();
  }
  q.opts = shuffle(opts);
  SQ.picked = null; SQ.checked = false; SQ.ok = false;
}

function sqFeedback(q){
  if(q.kind === "conj"){
    const c = CONJ[q.key];
    return `<div class="gblock" style="width:100%;margin-top:16px">
      <h3>${esc(q.key)} · 现在时</h3>
      <table class="conj">${SUBJ.map((s, k) => {
        const full = elide(s, c.pr[k]);
        return `<tr class="${k === q.i ? (SQ.ok ? "hl-ok" : "hl-no") : ""}">
           <td class="p">${esc(s)}</td><td>${esc(full)}</td>
           <td class="sp2"><button class="sp js-say" data-say="${esc(full)}">🔊</button></td></tr>`;
      }).join("")}</table>
      <div class="aux">例句用的是 <b>${esc(SUBJ[q.i])}</b> 这一栏　·　点每行的 🔊 可以听</div></div>`;
  }
  if(q.kind === "adj"){
    return `<div class="gblock" style="width:100%;margin-top:16px">
      <h3>${esc(q.key)} 的四种形式</h3>
      <div class="chips">${["阳性单数","阴性单数","阳性复数","阴性复数"].map((lab, k) =>
        `<span class="chip ${q.forms[k] === q.a ? "ok" : ""}"><em>${lab}</em>${esc(q.forms[k])}</span>`).join("")}</div></div>`;
  }
  const g = q.pos.indexOf("n.f.") >= 0 ? "阴性名词 n.f." : "阳性名词 n.m.";

    </div>
    ${SQ.checked ? sqFeedback(q) : ""}
    ${SQ.checked ? `<button class="sound js-sqsay" style="margin-top:14px">🔊 听整句</button>` : ""}
    <div class="cjo">${q.opts.map((o, k) => {
      let cls = "";
      if(SQ.checked){
        if(o.toLowerCase() === q.a.toLowerCase()) cls = "right";
        else if(k === SQ.picked) cls = "wrong";
      }
      return `<button class="opt ${cls}" data-sqo="${k}" style="text-align:center" ${SQ.checked ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>
  </div>
  <div style="padding:16px 16px 24px">
    ${SQ.checked
      ? `<button class="btn primary wide" id="sqnext">继续 ›</button>`
      : `<div class="note">选一个填进空里</div>`}
  </div>`;
  if(fresh) window.scrollTo(0,0);

  document.getElementById("quit").onclick = ()=> q.kind === "conj" ? renderConjIndex() : renderGenderIndex();
  const says = document.querySelector(".js-sqsay");
  if(says) says.onclick = ()=>{ stopAll(); speak(q.s.replace("___", q.a)); };
  app.querySelectorAll(".js-say").forEach(b=> b.onclick = ()=>{ stopAll(); speak(b.dataset.say); });
  app.querySelectorAll("[data-sqo]").forEach(b=>{
    b.onclick = ()=>{
      const idx = parseInt(b.dataset.sqo, 10);
      SQ.picked = idx;
      SQ.ok = sqRight(q.opts[idx], q);
      if(SQ.ok) SQ.right++; else SQ.wrong++;
      SQ.checked = true;
      renderSQ(false);
      if(SQ.ok) celebrate(".cjo .opt.right");
    };
  });
  const nx = document.getElementById("sqnext");
  if(nx) nx.onclick = sqAdvance;
}

function sqAdvance(){
  if(!SQ.ok){                          // 答错 → 排到队尾，直到答对
    SQ.queue.push(SQ.queue[SQ.i]);
    SQ.requeued++;
  }
  SQ.i++;
  if(SQ.i >= SQ.queue.length){ sqFinish(); return; }
  sqBuild();
  renderSQ(true);
}

function sqFinish(){
  screen = "sqdone";
  const base = SQ.base.length;
  app.innerHTML = `
  <div class="topbar"><div class="back" id="back">‹</div>
    <div class="ttl">${esc(SQ.title)}</div><div class="pill">完成</div></div>
  <div class="wrap" style="justify-content:center;align-items:center;text-align:center;gap:14px">
    <div style="font-size:52px">🎉</div>
    <h2 style="margin:0">完成</h2>
    <p style="color:var(--ink2);font-size:14px;line-height:1.8;margin:0">
      一共 ${base} 句<br>
      答对 ${SQ.right} 次，答错 ${SQ.wrong} 次${SQ.requeued ? `，重做 ${SQ.requeued} 题` : ""}</p>
    <div style="height:8px"></div>
    <button class="btn primary wide" id="again">再来一轮</button>
    <button class="btn ghost wide" id="home">回到课表</button>
  </div>`;
  window.scrollTo(0,0);
  document.getElementById("again").onclick = ()=>startSQ(SQ.base, SQ.title);
  document.getElementById("home").onclick = renderHome;
  document.getElementById("back").onclick = renderHome;
}

initVoices();
probeAudio();
renderHome();

// 作为 App 用（PWA）：需要有 http(s) 来源，file:// 打开时会自动跳过
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js")
    .catch(e => console.warn("Service Worker 没注册上（离线功能会受影响）：", e));
}
</script>
</body>
