<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>法语单词 · 新经典法语（第二版）第一册</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3f7d6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="法语单词">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg1:#eef3f7; --bg2:#e9eef6; --bg3:#f6eef0;
  --ink:#1b2430; --ink2:#5a6675; --ink3:#93a0ae;
  --line:#e2e8ef; --card:#ffffff;
  --brand:#3f7d6e; --brand-soft:#e6f2ee;
  --red:#d9534f;
  --shadow:0 6px 24px rgba(30,50,80,.07);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 8% -8%, #f4e6ea 0%, transparent 60%),
    radial-gradient(800px 520px at 100% 0%, #e4eef6 0%, transparent 55%),
    radial-gradient(700px 600px at 50% 110%, #e8f1ec 0%, transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2) 60%,var(--bg3));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;position:sticky;top:0;z-index:20;
  backdrop-filter:blur(14px);background:rgba(255,255,255,.66);border-bottom:1px solid rgba(226,232,239,.9)}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;cursor:pointer;font-size:17px;color:var(--ink2);flex:none}
.back:active{background:#f2f6fa}
.topbar .ttl{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);
  padding:5px 10px;border-radius:999px;flex:none;font-variant-numeric:tabular-nums}

.wrap{padding:16px;flex:1;display:flex;flex-direction:column}
.btn{border:none;border-radius:16px;padding:15px 18px;font-size:16px;font-weight:600;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(63,125,110,.28)}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.danger{background:#fff;border:1px solid #f0d9d7;color:#b9453f}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}

.hero{padding:22px 16px 6px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.4px}
.hero p{margin:8px 0 0;color:var(--ink2);font-size:13.5px;line-height:1.7}
.alert{margin:14px 16px 0;background:#fdf4e3;border:1px solid #f0e0c0;border-radius:16px;
  padding:13px 15px;font-size:13px;line-height:1.75;color:#8a6320}
.alert b{color:#6f4d14}
.reviews{display:flex;gap:12px;padding:16px 16px 0}
.rcard{flex:1;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;font-family:inherit}
.rcard:active{background:#f7fafc}
.rcard .n{font-size:24px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.rcard .l{font-size:12.5px;color:var(--ink2);margin-top:3px}
.rcard .sub{font-size:11.5px;color:var(--ink3);margin-top:6px}
.rcard.due .n{color:var(--brand)}
.rcard.wrong .n{color:var(--red)}
.rcard.off{opacity:.45;cursor:default}
.parc{margin:18px 16px 0;background:rgba(255,255,255,.72);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.parc>h2{margin:0;padding:14px 16px 10px;font-size:13px;color:var(--ink2);font-weight:600;display:flex;gap:8px}
.parc>h2 em{font-style:normal;color:var(--ink3);font-weight:500}
.lesson{display:flex;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer}
.lesson:active{background:rgba(240,245,250,.9)}
.lesson .no{width:44px;height:44px;flex:none;border-radius:14px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-size:13px;font-weight:700;line-height:1.1}
.lesson .mid{flex:1;min-width:0}
.lesson .fr{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .zh{font-size:12.5px;color:var(--ink2);margin-top:3px}
.lesson .rt{flex:none;text-align:right;font-size:11.5px;color:var(--ink3);line-height:1.5}
.lesson .rt b{display:block;font-size:12.5px;color:var(--ink2);font-weight:600}
.lesson.done .no{background:#e7f3ee;color:#2f7d5f}
.lesson.done .no::after{content:"✓"}
.duebadge{display:inline-block;font-size:10.5px;color:var(--brand);background:var(--brand-soft);
  border-radius:999px;padding:1px 7px;margin-left:6px}

.bar{height:5px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;margin:0 16px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#5aa88f,#3f7d6e);width:0;transition:width .3s}
.rounds{display:flex;gap:6px;padding:10px 16px 0}
.rounds span{flex:1;text-align:center;font-size:11.5px;padding:5px 0;border-radius:999px;
  background:rgba(255,255,255,.7);color:var(--ink3);border:1px solid var(--line)}
.rounds span.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rounds span.done{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:22px 16px 0;gap:6px}
.word{font-size:44px;font-weight:700;letter-spacing:-1px;text-align:center;line-height:1.15;word-break:break-word}
.word.small{font-size:34px}
.pos{font-size:13px;color:var(--ink3);font-style:italic;letter-spacing:.4px}
.sound{margin-top:4px;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:6px 14px;font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit}
.sound:active{background:#f2f6fa}
.opts{display:flex;flex-direction:column;gap:11px;width:100%;margin-top:20px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;
  font-size:15.5px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);
  box-shadow:0 2px 10px rgba(30,50,80,.04)}
.opt:active{background:#f7fafc}
.opt.right{border-color:#4f9d7e;background:#ecf6f1}
.opt.wrong{border-color:#d98b88;background:#fdf0ef}
.excard{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;box-shadow:var(--shadow);margin-top:18px}
.excard .fr{font-size:19px;line-height:1.6}
.excard .fr b{color:var(--brand);font-weight:700}
.excard .zh{margin-top:10px;font-size:14px;color:var(--ink2);line-height:1.7}
.exfoot{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.snd-mini{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;
  font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit}
.snd-mini:active{background:#f2f6fa}
.autobtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:34px;height:34px;
  font-size:14px;cursor:pointer;flex:none;font-family:inherit;color:var(--ink2)}
.autobtn:active{background:#f2f6fa}
.hint{margin-top:16px;width:64px;height:64px;border-radius:50%;border:1px solid var(--line);
  background:#fff;display:grid;place-items:center;font-size:22px;cursor:pointer;box-shadow:var(--shadow)}
.hint:active{background:#f2f6fa}
.hintlbl{font-size:12px;color:var(--ink3);margin-top:8px}
.answers{display:flex;gap:12px;width:100%;margin:auto 0 20px}
.answers .btn{flex:1;border:1px solid var(--line);padding:16px 10px}
.answers .yes{color:#2f7d5f}
.answers .no{color:#b9453f}

.detail{padding:0 16px 28px}
.dhead{text-align:center;padding:24px 0 18px}
.dhead .w{font-size:40px;font-weight:700;letter-spacing:-1px}
.dhead .meta{margin-top:8px;font-size:13px;color:var(--ink2)}
.tag{display:inline-block;font-size:11px;color:var(--brand);background:var(--brand-soft);
  border-radius:999px;padding:3px 9px;margin-left:8px}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
  box-shadow:var(--shadow);margin-bottom:14px}
.block h3{margin:0 0 12px;font-size:12.5px;color:var(--ink3);font-weight:600;letter-spacing:.6px;
  text-transform:uppercase;display:flex;align-items:center;gap:8px}
.block h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sent{font-size:16px;line-height:1.65}
.sent .zh{display:block;margin-top:8px;font-size:13.5px;color:var(--ink2);line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;background:#f4f7fa;border:1px solid var(--line);border-radius:10px;padding:6px 11px}
.chip.ant{background:#fdf3f2;border-color:#f2dedc}
.chip em{font-style:normal;color:var(--ink3);font-size:11.5px;margin-right:4px}
.tenses{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.tenses button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;
  font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit}
.tenses button.on{background:var(--brand);border-color:var(--brand);color:#fff}
table.conj{width:100%;border-collapse:collapse;font-size:15px}
table.conj td{padding:7px 0;border-bottom:1px solid #f1f5f9;vertical-align:top}
table.conj tr:last-child td{border-bottom:none}
table.conj td.p{width:82px;color:var(--ink3);font-size:13px}
table.conj td.sp2{width:32px;text-align:right;padding:0}
table.conj td.sp2 .sp{width:28px;font-size:13px;background:none;border:none}
.aux{font-size:12.5px;color:var(--ink3);margin-top:10px}
.srsline{font-size:12.5px;color:var(--ink2);background:var(--brand-soft);border-radius:12px;
  padding:9px 13px;margin-top:12px;text-align:center}
.srsline.retry{background:#fdf4e3;color:#8a6320}
.retryhint{font-size:11.5px;color:#8a6320;background:#fdf4e3;border-radius:10px;
  padding:7px 12px;margin:10px 16px 0;text-align:center}
.optlist{display:flex;flex-direction:column;gap:9px}
.orow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;
  background:#f7fafc;border:1px solid var(--line)}
.orow.ok{background:#ecf6f1;border-color:#cfe7db}
.orow.bad{background:#fdf0ef;border-color:#f0d5d3}
.orow .mk{width:18px;flex:none;text-align:center;font-size:14px;color:var(--ink3)}
.orow.ok .mk{color:#2f7d5f}
.orow.bad .mk{color:var(--red)}
.orow .zh{flex:1;min-width:0;font-size:14px;line-height:1.5}
.orow .fr2{flex:none;font-size:14.5px;font-weight:700;color:var(--brand);text-align:right}
.orow.bad .fr2{color:var(--red)}
.orow .pos2{font-size:11px;color:var(--ink3);font-weight:400;margin-left:5px}
.footer{display:flex;flex-direction:column;gap:10px;padding:14px 0 6px}
.note{font-size:12.5px;color:var(--ink3);text-align:center;line-height:1.7}

.wlist{padding:0 16px 24px}
.witem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:9px;box-shadow:0 2px 10px rgba(30,50,80,.04)}
.witem .mid{flex:1;min-width:0;cursor:pointer}
.witem .fr{font-size:15.5px;font-weight:600}
.witem .zh{font-size:12.5px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.witem .meta{font-size:11px;color:var(--ink3);margin-top:3px}
.witem .x{width:32px;height:32px;flex:none;border-radius:10px;border:1px solid var(--line);background:#fff;
  color:var(--ink3);cursor:pointer;font-family:inherit;font-size:14px}
.empty{padding:60px 24px;text-align:center;color:var(--ink3);font-size:14px;line-height:1.9}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);max-width:min(560px,92vw);
  background:rgba(27,36,48,.95);color:#fff;font-size:13.5px;line-height:1.75;padding:13px 16px;
  border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);opacity:0;transition:opacity .25s,transform .25s;
  z-index:99;white-space:pre-line}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 语法笔记 ---------- */
.gcard{display:flex;align-items:center;gap:13px;margin:12px 16px 0;
  background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;font-family:inherit;width:calc(100% - 32px)}
.gcard:active{background:#f7fafc}
.gcard .ico{width:42px;height:42px;flex:none;border-radius:13px;background:#eef1fa;
  display:grid;place-items:center;font-size:20px}
.gcard .mid{flex:1;min-width:0}
.gcard .l{font-size:15px;font-weight:600}
.gcard .sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.gcard .arw{color:var(--ink3);font-size:19px;flex:none}
.ghead{padding:20px 16px 4px}
.ghead h1{margin:0;font-size:22px;letter-spacing:-.3px}
.ghead .sub{font-size:13px;color:var(--ink2);margin-top:6px}
.gbody{padding:6px 16px 30px}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chiprow .chip{font-size:12.5px;padding:5px 10px}
.gblock{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.gblock h3{margin:0 0 11px;font-size:16px;line-height:1.45;font-weight:700}
.gblock h3 .num{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;
  border-radius:7px;background:var(--brand-soft);color:var(--brand);font-size:12px;
  font-weight:700;margin-right:8px;vertical-align:1px}
.gtxt{font-size:14.5px;line-height:1.85;color:var(--ink);white-space:pre-line}
.gtxt b{color:var(--brand)}
.gtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px}
.gtable td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;line-height:1.6}
.gtable tr:first-child td{background:#f6f9fb;font-weight:600;color:var(--ink2);font-size:12.5px}
.gtable td:first-child{color:var(--ink2);white-space:nowrap}
.gindex{padding:6px 16px 30px}

/* ---------- 课文 ---------- */
.tex{padding:6px 16px 30px}
.tblock{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
  box-shadow:var(--shadow);margin-bottom:14px}
.tlabel{font-size:13.5px;font-weight:700;color:var(--brand);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tpart{font-size:12.5px;font-weight:600;color:var(--ink2);margin:14px 0 4px;
  padding-top:10px;border-top:1px solid #f1f5f9}
.tpart:first-of-type{border-top:none;padding-top:0;margin-top:4px}
.tline{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.tline .tx{flex:1;font-size:15.5px;line-height:1.75}
.tline .cn{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:3px}
.tline .sp{width:28px;flex:none;border:none;background:transparent;cursor:pointer;font-size:14px;
  color:var(--ink3);padding:3px 0;font-family:inherit}
.tline .sp:active{color:var(--brand)}
.tline.playing{background:#e9f5ef;border-radius:9px;box-shadow:0 0 0 6px #e9f5ef}

/* 课文全文播放器：倍速 + 可拖动进度条 */
.player{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px 10px;margin:2px 0 12px;box-shadow:var(--shadow)}
.pl-row{display:flex;align-items:center;gap:11px}
.pl-play{width:42px;height:42px;flex:none;border-radius:50%;border:none;background:var(--brand);
  color:#fff;font-size:15px;cursor:pointer;font-family:inherit;display:grid;place-items:center;
  padding:0;line-height:1}
.pl-play:active{transform:scale(.94)}
.pl-play.wait{background:#9dc9b4}
.pl-seek{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;
  background:var(--line);outline:none;cursor:pointer;margin:0}
.pl-seek::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.28);cursor:pointer}
.pl-seek::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;background:var(--brand);
  box-shadow:0 1px 4px rgba(0,0,0,.28);cursor:pointer}
.pl-t{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none;
  min-width:76px;text-align:right}
.pl-row2{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.pl-rates{display:flex;gap:6px}
.pl-rates button{border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:5px 12px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:inherit}
.pl-rates button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pl-hint{font-size:11px;color:var(--ink3)}
.tbar{display:flex;gap:9px;padding:12px 0 0;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;
  cursor:pointer;font-family:inherit;color:var(--ink2)}
.chipbtn:active{background:#f2f6fa}
.chipbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* 填空 */
.czline{font-size:16.5px;line-height:2.6;margin-bottom:12px}
.czslot{display:inline-block;min-width:62px;height:32px;line-height:30px;margin:0 4px;padding:0 9px;
  border:2px dashed #cbd8e2;border-radius:9px;text-align:center;vertical-align:-5px;
  font-size:15.5px;cursor:pointer;background:#fbfdff;color:var(--brand);font-weight:700}
.czslot.full{border-style:solid;border-color:#9dc9b4;background:#f2faf6;cursor:grab;touch-action:none}
.czslot.drop-hit{border-color:var(--brand);background:#e3f2ec;border-style:solid}
.czslot.ok{border-color:#4f9d7e;background:#e7f6ef;color:#2f7d5f;border-style:solid}
.czslot.no{border-color:#d98b88;background:#fdeeed;color:#b9453f;border-style:solid}
.czbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.czword{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-size:15px;
  cursor:grab;font-family:inherit;color:var(--ink);touch-action:none;user-select:none}
.czword:active{background:#f7fafc}
.czword.used{opacity:.22;pointer-events:none}
.czdrag{position:fixed;z-index:999;pointer-events:none;border:1px solid var(--brand);background:#fff;
  border-radius:11px;padding:9px 14px;font-size:15px;box-shadow:0 10px 26px rgba(0,0,0,.2);
  transform:translate(-50%,-50%);font-family:inherit;color:var(--ink)}
.czfoot{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;
  margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.czfoot .btn{padding:13px 22px;font-size:15.5px}
.czres{font-size:17px;font-weight:700;padding:0 8px}
.czres.ok{color:#2f7d5f}
.czres.no{color:#b9453f}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 排序（拖拽式） */
.oslot{display:flex;align-items:flex-start;gap:10px;background:#fbfdff;border:1.5px dashed #cbd8e2;
  border-radius:13px;padding:11px 13px;margin-bottom:9px;min-height:50px;
  transition:border-color .15s,background .15s}
.oslot.full{border-style:solid;border-color:#9dc9b4;background:#f4faf7;cursor:grab}
.oslot.drop-hit{border-color:var(--brand);border-style:solid;background:#e3f2ec}
.oslot.ok{border-color:#4f9d7e;background:#e7f6ef}
.oslot.no{border-color:#d98b88;background:#fdeeed}
.oslot .onum{flex:none;width:18px;font-size:12px;color:var(--ink3);font-weight:700;line-height:1.7}
.oslot .oempty{color:var(--ink3);font-size:13px;line-height:1.7}
.oslot-in{flex:1;min-width:0}
.oitem{font-size:15px;line-height:1.6;touch-action:none;user-select:none}
.opool .oitem{background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:9px;cursor:grab}
.opool .oitem:active{background:#f7fafc}
.oitem .zh{display:block;font-size:12px;color:var(--ink3);margin-top:3px}
.opool{min-height:56px;border:1.5px dashed transparent;border-radius:13px;padding:4px;margin-top:4px}
.opool.drop-hit{border-color:var(--brand);background:#eef7f2}

/* 情境句练习（变位 / 阴阳性） */
.cjo{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:18px}
table.conj tr.hl-ok td{background:#ecf6f1}
table.conj tr.hl-no td{background:#fdf0ef}
table.conj tr.hl-ok td.p,table.conj tr.hl-no td.p{font-weight:700}
.sqcard{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 18px;box-shadow:var(--shadow);margin-top:8px}
.sqsent{font-size:19px;line-height:1.95}
.sqzh{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);
  font-size:13.5px;color:var(--ink2);line-height:1.7}
.sqblank{display:inline-block;min-width:86px;height:28px;margin:0 4px;vertical-align:-5px;
  border-bottom:2.5px solid var(--brand);background:var(--brand-soft);border-radius:5px}
.sqfill{color:var(--brand);font-weight:700}
.sqfill.no{color:var(--red);text-decoration:line-through}
.chip.ok{background:#e7f6ef;border-color:#cfe7db;color:#2f7d5f;font-weight:600}

/* ---- 查单词 ---- */
.sbox{display:flex;gap:10px;margin:2px 16px 8px}
.sbar{padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);
  color:var(--ink3);font-size:15px;cursor:pointer;flex:1;box-shadow:var(--shadow)}
.sbar:active{background:var(--brand-soft);color:var(--ink2)}
.sbox input{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;
  font-size:15px;font-family:inherit;color:var(--ink);background:var(--card);outline:none;
  -webkit-appearance:none;appearance:none}
.sbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.shint{padding:12px 16px 4px;font-size:13px;color:var(--ink3);line-height:1.75}
.shint b{color:var(--ink2)}
.slist{padding:4px 16px 30px}
.srow{display:flex;gap:12px;align-items:center;padding:13px 16px;
  border-top:1px solid var(--line);cursor:pointer}
.srow:first-child{border-top:none}
.srow:active{background:var(--brand-soft)}
.srow .mid{flex:1;min-width:0}
.srow .fr{font-size:17px;font-weight:600;color:var(--ink);word-break:break-word}
.srow .zh{font-size:13.5px;color:var(--ink2);margin-top:3px}
.srow .rt{font-size:12px;color:var(--ink3);white-space:nowrap}
.via{margin-top:7px;font-size:12.5px;color:#2f6b57;background:var(--brand-soft);
  border-radius:8px;padding:5px 10px;display:inline-block;line-height:1.5}
.via b{color:var(--brand)}

/* ---- 答对的小庆祝（彩条 + 弹一下） ---- */
#confetti{position:fixed;left:0;right:0;top:0;bottom:0;pointer-events:none;overflow:hidden;z-index:99}
.cfp{position:absolute;top:-16px;border-radius:2px}
@keyframes cfall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(105vh) rotate(680deg);opacity:.9}
}
@keyframes cbounce{
  0%{transform:scale(1)}
  35%{transform:scale(1.075)}
  65%{transform:scale(.98)}
  100%{transform:scale(1)}
}
.bounce{animation:cbounce .52s cubic-bezier(.25,.85,.35,1.15)}
/* 系统开了「减少动态效果」就别动，只留颜色反馈 */
@media (prefers-reduced-motion: reduce){
  .cfp{display:none}
  .bounce{animation:none}
}

/* ---- 教材来源署名 ---- */
.src{margin:6px 16px 34px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;

.src b{display:block;color:var(--ink2);font-size:12.5px;margin-bottom:6px}
.src .line{display:block}
.srcline{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:11.5px;line-height:1.75;color:var(--ink3)}
</style>

const DATA = {"words":[{"fr":"à","pos":"prép.","zh":"在","s":1,"ex":"Je vais à Paris.","exZh":"我去巴黎。","more":[{"s":"Nous nous sommes retrouvés à la terrasse d'un café, à deux pas de la gare.","zh":"我们在离火车站两步远的一家咖啡馆露天座位上碰了面。"}]},{"fr":"à cause de","pos":"loc.prép.","zh":"由于","s":14,"ex":"Le train est en retard à cause de la neige.","exZh":"由于下雪，火车晚点了。","more":[{"s":"Le match a été reporté à cause du mauvais temps.","zh":"比赛因为天气不好推迟了。"}]},{"fr":"à côté de","pos":"loc.prép.","zh":"在……旁边","s":10,"ex":"La banque est à côté de la poste.","exZh":"银行在邮局旁边。","more":[{"s":"Sa maison se trouve juste à côté de celle de ses parents.","zh":"他家就在他父母家旁边。"}]},{"fr":"À demain.","pos":"","zh":"明天见。","s":1,"ex":"Bon, à demain !","exZh":"好，明天见！","more":[{"s":"Je dois filer, à demain et bonne soirée !","zh":"我得走了，明天见，晚上愉快！"}]},{"fr":"à destination de","pos":"","zh":"开往……","s":12,"ex":"Le train à destination de Lyon part à 8 heures.","exZh":"开往里昂的火车 8 点发车。","more":[{"s":"Le vol à destination de Montréal décollera avec une heure de retard.","zh":"飞往蒙特利尔的航班将晚一小时起飞。"}]},{"fr":"à gauche","pos":"","zh":"在左边","s":9,"ex":"Tournez à gauche.","exZh":"向左转。","more":[{"s":"En sortant de la gare, tournez à gauche et continuez tout droit.","zh":"出火车站后向左转，然后一直往前走。"}]},{"fr":"à l'heure","pos":"","zh":"准时","s":12,"ex":"Le train arrive à l'heure.","exZh":"火车准时到达。","more":[{"s":"Grâce au TGV, nous sommes arrivés à l'heure malgré la grève.","zh":"多亏高铁，尽管有罢工我们还是准时到了。"}]},{"fr":"À tout à l'heure.","pos":"","zh":"待会儿见。","s":11,"ex":"Je reviens, à tout à l'heure !","exZh":"我回来，待会儿见！","more":[{"s":"Je dois passer chez le médecin, à tout à l'heure !","zh":"我得去看医生，待会儿见！"}]},{"fr":"accompagner","pos":"v.t.","zh":"配（某种菜）；陪同","s":8,"ex":"Le vin blanc accompagne bien le poisson.","exZh":"白葡萄酒很适合配鱼。","more":[{"s":"Ma sœur m'a accompagné jusqu'à l'aéroport pour me dire au revoir.","zh":"姐姐一直送我到机场跟我道别。"}]},{"fr":"acheter","pos":"v.t.","zh":"购买","s":8,"ex":"J'achète du pain tous les matins.","exZh":"我每天早上买面包。","more":[{"s":"J'ai acheté ce manteau pendant les soldes, il m'a coûté moitié prix.","zh":"我趁打折买了这件大衣，只花了一半价钱。"}]},{"fr":"activité","pos":"n.f.","zh":"活动","s":5,"ex":"Quelles sont vos activités préférées ?","exZh":"您最喜欢的活动是什么？","more":[{"s":"Parmi toutes les activités proposées, c'est la photographie qui l'intéresse le plus.","zh":"在所有提供的活动中，他最感兴趣的是摄影。"}]},{"fr":"adaptation","pos":"n.f.","zh":"适应","s":14,"ex":"Son adaptation à la vie en France est difficile.","exZh":"他对法国生活的适应很困难。","more":[{"s":"Son adaptation à la vie parisienne a pris plusieurs mois.","zh":"他适应巴黎生活花了好几个月。"}]},{"fr":"adorable","pos":"adj.","zh":"讨人喜欢的","s":3,"ex":"Ta petite sœur est adorable.","exZh":"你的妹妹很讨人喜欢。","more":[{"s":"Leur petite fille est adorable, elle sourit à tout le monde.","zh":"他们的小女儿很讨人喜欢，见谁都笑。"}]},{"fr":"adorer","pos":"v.t.","zh":"酷爱","s":2,"ex":"J'adore le chocolat.","exZh":"我酷爱巧克力。","more":[{"s":"J'adore me promener au bord de la mer quand il n'y a personne.","zh":"我喜欢在没人的时候去海边散步。"}]},{"fr":"aéroport","pos":"n.m.","zh":"机场","s":14,"ex":"Je vais à l'aéroport à 6 heures.","exZh":"我 6 点去机场。","more":[{"s":"Comme il y avait des embouteillages, nous sommes arrivés à l'aéroport en retard.","zh":"因为堵车，我们到机场时迟了。"}]},{"fr":"affaires","pos":"n.f.pl.","zh":"（个人的）衣物","s":11,"ex":"Elle range ses affaires dans le placard.","exZh":"她把衣物收进柜子里。","more":[{"s":"Elle a rangé ses affaires d'hiver au fond du placard.","zh":"她把冬衣收在柜子最里面。"}]},{"fr":"âge","pos":"n.m.","zh":"年龄","s":4,"ex":"Quel âge avez-vous ?","exZh":"您多大年龄？","more":[{"s":"À mon âge, on commence à apprécier les choses simples.","zh":"到了我这个年纪，开始懂得欣赏简单的东西。"}]},{"fr":"agréable","pos":"adj.","zh":"舒适的，愉快的","s":11,"ex":"Cet appartement est très agréable.","exZh":"这套公寓很舒适。","more":[{"s":"Cet appartement est agréable à vivre, surtout en été.","zh":"这套公寓住着很舒服，尤其是夏天。"}]},{"fr":"aider","pos":"v.t.","zh":"帮助","s":9,"ex":"Tu peux m'aider ?","exZh":"你能帮我吗？","more":[{"s":"Il m'a aidé à porter mes valises jusqu'au sixième étage.","zh":"他帮我把箱子一直搬到七楼。"}]},{"fr":"aimer","pos":"v.t.","zh":"喜欢，爱","s":2,"ex":"J'aime la musique.","exZh":"我喜欢音乐。","more":[{"s":"J'aime beaucoup ce quartier, mais je le trouve un peu bruyant.","zh":"我很喜欢这个街区，只是觉得有点吵。"}]},{"fr":"aîné, e","pos":"n.&adj.","zh":"长子，长女 & 年长的","s":11,"ex":"Il est le fils aîné de la famille.","exZh":"他是家里的长子。","more":[{"s":"C'est mon frère aîné qui s'occupe de tout depuis la mort de nos parents.","zh":"父母去世后，是我哥哥在打理一切。"}]},{"fr":"ainsi","pos":"adv.","zh":"这样；因此","s":14,"ex":"Il pleut, ainsi je reste à la maison.","exZh":"下雨了，因此我待在家里。","more":[{"s":"Le musée était fermé, ainsi nous n'avons pas pu voir l'exposition.","zh":"博物馆关门了，因此我们没能看到展览。"}]},{"fr":"Aix-en-Provence","pos":"","zh":"普罗旺斯地区艾克斯（法国城市）","s":7,"ex":"Elle étudie à Aix-en-Provence.","exZh":"她在普罗旺斯地区艾克斯学习。","more":[{"s":"Aix-en-Provence est célèbre pour ses fontaines et son festival d'art lyrique.","zh":"普罗旺斯地区艾克斯以喷泉和歌剧节闻名。"}]},{"fr":"alcool","pos":"n.m.","zh":"酒精","s":8,"ex":"Je ne bois pas d'alcool.","exZh":"我不喝酒。","more":[{"s":"Il vaut mieux éviter l'alcool avant de prendre le volant.","zh":"开车前最好别喝酒。"}]},{"fr":"Alice","pos":"n.f.","zh":"艾丽斯（人名）","s":1,"ex":"Alice est dans ma classe.","exZh":"艾丽斯在我班上。","more":[{"s":"Alice a décidé de poursuivre ses études en France.","zh":"艾丽斯决定去法国继续学业。"}]},{"fr":"allemand","pos":"n.m.","zh":"德语","s":4,"ex":"Il apprend l'allemand.","exZh":"他学德语。","more":[{"s":"Elle parle couramment allemand parce qu'elle a grandi près de la frontière.","zh":"她德语说得很流利，因为她是在边境附近长大的。"}]},{"fr":"aller","pos":"v.i.","zh":"表示身体状况；去","s":1,"ex":"Comment allez-vous ?","exZh":"您身体怎么样？","more":[{"s":"Comment allez-vous depuis votre opération ?","zh":"手术之后您身体怎么样？"}]},{"fr":"aller au parc","pos":"","zh":"去公园","s":3,"ex":"On va au parc cet après-midi ?","exZh":"我们今天下午去公园吗？","more":[{"s":"On pourrait aller au parc si le temps le permet.","zh":"如果天气允许，我们可以去公园。"}]},{"fr":"Allô !","pos":"interj.","zh":"喂！（电话用语）","s":7,"ex":"Allô ! Qui est à l'appareil ?","exZh":"喂！请问是哪位？","more":[{"s":"Allô ! Je vous entends très mal
